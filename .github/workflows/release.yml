# A tag v<version> makes the release's files and puts them on a draft release; a person reads it and publishes it.
#   web             the screen, the bundled client library and its npm package (scripts/verify-web.py, without the
#                   end-to-end tests)
#   build-linux     compiles the tools for Linux x86_64 on the oldest Ubuntu runner (glibc portability) in parallel with web
#   build-windows   compiles the tools for Windows x86_64 with MSYS2 UCRT64 in parallel with web
#   package-linux   packages and checks the Linux tools archive (scripts/package.py tools --prebuilt, verify)
#   package-windows packages and checks the Windows tools archive (scripts/package.py tools --prebuilt, verify)
#   draft           once ci.yml has passed on the same commit: the template archive with both archives' SHA-256,
#                   SHA256SUMS, and the draft release (with the client library's npm package on its own), a pre-release
#                   when the version has a pre-release part
# Publishing the draft (by a person) starts publish-npm.yml, which puts that npm package on the npm registry; this
# workflow never publishes to npm.
# Run by hand (workflow_dispatch), it is a rehearsal: the same files, no release.
# Security: read-only token except in the draft job (contents: write, to create the release; actions: read, to
# see ci.yml's runs), no other secrets,
# actions pinned by commit hash (the tag in the comment). The tag is passed to the scripts through env, never
# pasted into a command line.
name: release

on:
  push:
    tags: ["v*"]
  # A rehearsal, from the Actions page: builds and checks every file of a release on the chosen commit, and makes
  # no release (the steps that need the tag are skipped).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: gui/web/.nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: web-node-modules
        with:
          path: gui/web/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('gui/web/package-lock.json') }}
      - name: Install the packages
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: gui/web
        run: npm ci
      - name: Runner image version
        id: runner-img
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Playwright version
        id: pw-ver
        run: |
          ver=$(node -p "require('./gui/web/package-lock.json').packages['node_modules/playwright-core'].version")
          test -n "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-pw
        with:
          path: ~/.cache/apt-debs/playwright
          key: apt-pw-ubuntu2404-${{ steps.runner-img.outputs.version }}-${{ steps.pw-ver.outputs.version }}
      - name: Install the browser of the unit tests of the GUI parts
        working-directory: gui/web
        run: |
          deb_dir="$HOME/.cache/apt-debs/playwright"
          mkdir -p "$deb_dir"
          ok=false
          if [ "${{ steps.apt-pw.outputs.cache-hit }}" = "true" ] && compgen -G "$deb_dir/*.deb" > /dev/null; then
            if sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive dpkg -i --no-triggers "$deb_dir"/*.deb &&
               sudo ldconfig &&
               (! command -v fc-cache > /dev/null 2>&1 || sudo fc-cache) &&
               npx playwright install-deps --dry-run chromium > /dev/null 2>&1; then
              ok=true
            else
              sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get update -q -o Acquire::Languages=none
              sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -f -y -q
            fi
          fi
          if [ "$ok" != "true" ]; then
            rm -f "$deb_dir"/*.deb
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            mkdir -p "$deb_dir/partial"
            trap 'sudo rm -f /etc/apt/apt.conf.d/99keep-debs' EXIT
            printf 'Dir::Cache::archives "%s";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' "$deb_dir" \
              | sudo tee /etc/apt/apt.conf.d/99keep-debs > /dev/null
            npx playwright install-deps chromium
            sudo rm -f /etc/apt/apt.conf.d/99keep-debs
            trap - EXIT
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            sudo chown -R "$(id -u):$(id -g)" "$deb_dir"
          fi
          npx playwright install --only-shell chromium
      - name: Build the screen and the client library
        run: python3 scripts/verify-web.py --skip-install --skip-e2e --tag release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: |
            gui/web/dist
            build/gui-client
          retention-days: 7

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CC: gcc-12
      CXX: g++-12
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      TAG: ${{ github.ref_name }}
      VEHICLE_SIL_LOG_ARTIFACT: logs-build-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Runner image version
        id: runner-img
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-release-tools
        with:
          path: ~/.cache/apt-debs/release-tools
          key: apt-release-tools-ubuntu2204-${{ steps.runner-img.outputs.version }}
      - name: Install GCC 12, Ninja and ccache
        run: |
          deb_dir="$HOME/.cache/apt-debs/release-tools"
          mkdir -p "$deb_dir"
          ok=false
          if [ "${{ steps.apt-release-tools.outputs.cache-hit }}" = "true" ] && compgen -G "$deb_dir/*.deb" > /dev/null; then
            if sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive dpkg -i --no-triggers "$deb_dir"/*.deb &&
               sudo ldconfig &&
               dpkg -s g++-12 ninja-build ccache > /dev/null 2>&1; then
              ok=true
            fi
          fi
          if [ "$ok" != "true" ]; then
            rm -f "$deb_dir"/*.deb
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            mkdir -p "$deb_dir/partial"
            sudo apt-get update -q -o Acquire::Languages=none
            sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -f -y -q \
              -o Dir::Cache::archives="$deb_dir" \
              -o APT::Keep-Downloaded-Packages=true \
              g++-12 ninja-build ccache
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            sudo chown -R "$(id -u):$(id -g)" "$deb_dir"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-package-linux-${{ github.sha }}
          restore-keys: ccache-package-linux-
      - name: Zero compiler cache statistics
        run: ccache -z
      # The scripts need Python 3.11+; this Ubuntu has 3.10, so uv brings one.
      - name: The version and the tag agree
        if: github.event_name == 'push'
        run: uv run --no-project --python 3.13 python scripts/package.py version --expect "$TAG"
      - name: Build tools binaries
        run: uv run --no-project --python 3.13 python scripts/package.py tools --build-only build/bin-linux --tag release
      - name: Compiler cache statistics and cleanup
        if: ${{ !cancelled() }}
        run: |
          ccache -s
          ccache -c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux
          path: build/bin-linux
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-build-linux
          path: build/logs
          retention-days: 14

  package-linux:
    needs: [web, build-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CC: gcc-12
      CXX: g++-12
      TAG: ${{ github.ref_name }}
      VEHICLE_SIL_LOG_ARTIFACT: logs-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Runner image version
        id: runner-img
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-release-tools
        with:
          path: ~/.cache/apt-debs/release-tools
          key: apt-release-tools-ubuntu2204-${{ steps.runner-img.outputs.version }}
      - name: Install GCC 12, Ninja and ccache
        run: |
          deb_dir="$HOME/.cache/apt-debs/release-tools"
          mkdir -p "$deb_dir"
          ok=false
          if [ "${{ steps.apt-release-tools.outputs.cache-hit }}" = "true" ] && compgen -G "$deb_dir/*.deb" > /dev/null; then
            if sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive dpkg -i --no-triggers "$deb_dir"/*.deb &&
               sudo ldconfig &&
               dpkg -s g++-12 ninja-build ccache > /dev/null 2>&1; then
              ok=true
            fi
          fi
          if [ "$ok" != "true" ]; then
            rm -f "$deb_dir"/*.deb
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            mkdir -p "$deb_dir/partial"
            sudo apt-get update -q -o Acquire::Languages=none
            sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -f -y -q \
              -o Dir::Cache::archives="$deb_dir" \
              -o APT::Keep-Downloaded-Packages=true \
              g++-12 ninja-build ccache
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            sudo chown -R "$(id -u):$(id -g)" "$deb_dir"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-linux
          path: build/bin-linux
      - name: Tools archive
        run: uv run --no-project --python 3.13 python scripts/package.py tools --prebuilt build/bin-linux --tag release
      - name: Check it as a user uses it
        run: |
          uv run --no-project --python 3.13 python scripts/package.py verify --tag release-verify \
            build/dist/vehicle-sil-tools-*-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-linux
          path: build/dist/vehicle-sil-tools-*
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux
          path: build/logs
          retention-days: 14

  build-windows:
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      TAG: ${{ github.ref_name }}
      VEHICLE_SIL_LOG_ARTIFACT: logs-build-windows
    steps:
      - name: Keep LF line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Exclude build and MSYS2 directories from Defender
        shell: pwsh
        run: |
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, 'C:\msys64')) {
            if ($p -and (Test-Path $p)) {
              try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { Write-Host "Defender exclusion skipped for ${p}: $_" }
            }
          }
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-python
      - name: Where ccache keeps its files
        run: echo "CCACHE_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.ccache")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-package-windows-${{ github.sha }}
          restore-keys: ccache-package-windows-
      - name: Zero compiler cache statistics
        run: ccache -z
      - name: The version and the tag agree
        if: github.event_name == 'push'
        run: python scripts/package.py version --expect "$TAG"
      - name: Build tools binaries
        run: python scripts/package.py tools --build-only build/bin-windows --tag release
      - name: Compiler cache statistics and cleanup
        if: ${{ !cancelled() }}
        run: |
          ccache -s
          ccache -c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows
          path: build/bin-windows
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-build-windows
          path: build/logs
          retention-days: 14

  package-windows:
    needs: [web, build-windows]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      TAG: ${{ github.ref_name }}
      VEHICLE_SIL_LOG_ARTIFACT: logs-windows
    steps:
      - name: Keep LF line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Exclude build and MSYS2 directories from Defender
        shell: pwsh
        run: |
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, 'C:\msys64')) {
            if ($p -and (Test-Path $p)) {
              try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { Write-Host "Defender exclusion skipped for ${p}: $_" }
            }
          }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-windows
          path: build/bin-windows
      - name: Tools archive
        run: python scripts/package.py tools --prebuilt build/bin-windows --tag release
      - name: Check it as a user uses it
        run: python scripts/package.py verify build/dist/vehicle-sil-tools-*-windows-x86_64.zip --tag release-verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-windows
          path: build/dist/vehicle-sil-tools-*
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-windows
          path: build/logs
          retention-days: 14

  draft:
    needs: [web, package-linux, package-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read  # the runs of ci.yml for this commit
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tools-*
          path: build/dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
      # The client library's npm package, the same file the tools archives carry: on the release on its own too.
      - name: Client library package
        run: cp build/gui-client/vehicle-sil-gui-client-*.tgz build/dist/
      # The release workflow builds and checks the archives only; the full tests are ci.yml's, on the same commit.
      - name: ci.yml passed on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json status,conclusion --jq 'if length == 0 then "no run" elif all(.[]; .conclusion == "success")
            then "success" else (map(.status + "/" + (.conclusion // "")) | join(", ")) end')
          if [ "$state" != success ]; then
            case "$state" in
              # Merges that followed each other: only the newest one's run of main is kept (ci.yml, concurrency).
              *cancelled*)
                echo "::error::ci.yml's run on $GITHUB_SHA was cancelled while it waited ($state), because a newer" \
                     "merge followed. Run it again (Actions > ci > the cancelled run of this commit > Re-run all" \
                     "jobs, or gh run rerun <id>), wait for it to pass, then re-run this job" ;;
              *)
                echo "::error::ci.yml has not passed on $GITHUB_SHA ($state): push the commit to main and wait for" \
                     "ci.yml to pass (or fix it), then re-run this job" ;;
            esac
            exit 1
          fi
      - name: Template archive and SHA256SUMS
        run: python3 scripts/package.py template
      # A rehearsal keeps what a release would have carried, to download and try as a user would.
      - name: The files of the rehearsal
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal
          path: |
            build/dist/vehicle-sil-tools-*
            build/dist/vehicle-sil-template-*.zip
            build/dist/vehicle-sil-gui-client-*.tgz
            build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # The notes: the body of this version's section of CHANGELOG.md ("## [<version>] - <date>"), with its
          # "###" and "####" headings, up to the next "## " heading or the link reference definitions at the end.
          awk -v h="## [$version] - " 'index($0, h) == 1 { on = 1; next } /^## |^\[[^]]*\]: / { on = 0 } on' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "error: CHANGELOG.md has no section \"## [$version] - YYYY-MM-DD\" with changes under it: add it in the commit that is tagged $TAG"
            exit 1
          fi
          # A version with a pre-release part (0.2.0-rc.1) is a pre-release on GitHub, not the latest release (and
          # publish-npm.yml puts it on npm as "next", not "latest").
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" --title "vehicle-sil $version" \
            --notes-file notes.md \
            build/dist/vehicle-sil-tools-* build/dist/vehicle-sil-template-*.zip \
            build/dist/vehicle-sil-gui-client-*.tgz build/dist/SHA256SUMS
