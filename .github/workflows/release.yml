# A tag v<version> makes the release's files and puts them on a draft release; a person reads it and publishes it.
#   web       the screen, the bundled client library and its npm package (scripts/verify-web.py, without the
#             browser tests)
#   linux     the tools archive for Linux x86_64, built on the oldest Ubuntu runner (an older glibc than the
#             distributions it runs on), and checked as a user uses it (scripts/package.py tools, verify)
#   windows   the same for Windows x86_64 with MSYS2 UCRT64
#   draft     once ci.yml has passed on the same commit: the template archive with both archives' SHA-256,
#             SHA256SUMS, and the draft release (with the client library's npm package on its own)
# Security: read-only token except in the draft job (contents: write, to create the release; actions: read, to
# see ci.yml's runs), no other secrets,
# actions pinned by commit hash (the tag in the comment). The tag is passed to the scripts through env, never
# pasted into a command line.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: gui/web/.nvmrc
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - name: Build the screen and the client library
        run: python3 scripts/verify-web.py --skip-e2e --tag release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: |
            gui/web/dist
            build/gui-client
          retention-days: 7

  linux:
    needs: web
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CC: gcc-12
      CXX: g++-12
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      TAG: ${{ github.ref_name }}
      VEHICLE_SIL_LOG_ARTIFACT: logs-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install GCC 12, Ninja and ccache
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-12 ninja-build ccache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-package-linux-${{ github.sha }}
          restore-keys: ccache-package-linux-
      # The scripts need Python 3.11+; this Ubuntu has 3.10, so uv brings one.
      - name: The version and the tag agree
        run: uv run --no-project --python 3.13 python scripts/package.py version --expect "$TAG"
      - name: Tools archive
        run: uv run --no-project --python 3.13 python scripts/package.py tools --tag release
      - name: Check it as a user uses it
        run: |
          uv run --no-project --python 3.13 python scripts/package.py verify --tag release-verify \
            build/dist/vehicle-sil-tools-*-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-linux
          path: build/dist/vehicle-sil-tools-*
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux
          path: build/logs
          retention-days: 14

  windows:
    needs: web
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      TAG: ${{ github.ref_name }}
      VEHICLE_SIL_LOG_ARTIFACT: logs-windows
    steps:
      - name: Keep LF line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          # uv (installed above for Windows) is found through the inherited PATH.
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
      - name: Where ccache keeps its files
        run: echo "CCACHE_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.ccache")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-package-windows-${{ github.sha }}
          restore-keys: ccache-package-windows-
      - name: The version and the tag agree
        run: python scripts/package.py version --expect "$TAG"
      - name: Tools archive
        run: python scripts/package.py tools --tag release
      - name: Check it as a user uses it
        run: python scripts/package.py verify build/dist/vehicle-sil-tools-*-windows-x86_64.zip --tag release-verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-windows
          path: build/dist/vehicle-sil-tools-*
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-windows
          path: build/logs
          retention-days: 14

  draft:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read  # the runs of ci.yml for this commit
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tools-*
          path: build/dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
      # The client library's npm package, the same file the tools archives carry: on the release on its own too.
      - name: Client library package
        run: cp build/gui-client/vehicle-sil-gui-client-*.tgz build/dist/
      # The release workflow builds and checks the archives only; the full tests are ci.yml's, on the same commit.
      - name: ci.yml passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json status,conclusion --jq 'if length == 0 then "no run" elif all(.[]; .conclusion == "success")
            then "success" else (map(.status + "/" + (.conclusion // "")) | join(", ")) end')
          if [ "$state" != success ]; then
            echo "::error::ci.yml has not passed on $GITHUB_SHA ($state): push the commit to main and wait for ci.yml" \
                 "to pass (or fix it), then re-run this job"
            exit 1
          fi
      - name: Template archive and SHA256SUMS
        run: python3 scripts/package.py template
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # The notes: this version's section of CHANGELOG.md.
          awk -v v="$version" '$0 ~ "^## " { on = index($0, "## " v) == 1; next } on' CHANGELOG.md > notes.md
          gh release create "$TAG" --draft --verify-tag --title "vehicle-sil $version" --notes-file notes.md \
            build/dist/vehicle-sil-tools-* build/dist/vehicle-sil-template-*.zip \
            build/dist/vehicle-sil-gui-client-*.tgz build/dist/SHA256SUMS
