# Checks of every push to main and every pull request: the C++ build and tests (Linux presets, one of them also
# with the oldest CMake that README.md asks for, Windows with MSYS2 UCRT64), the browser GUI, and the Python code. Each job calls the repository's script that a developer
# runs (AGENTS.md, "検証とスクリプト"); on failure, its logs (build/logs) are kept as an artifact.
# Security: read-only token, no secrets, actions pinned by commit hash (the tag in the comment).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # linux-gcc-static: VEHICLE_SIL_STATIC=ON (SIL Kit and the C++ runtime linked into each executable)
        preset: [linux-gcc-debug, linux-gcc-release, linux-gcc-static]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Ninja and ccache
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build ccache
      - name: Python environment (PyYAML for the code generator, gRPC for the Python tests)
        run: uv sync --locked
      # The compiler cache: SIL Kit and everything else compiles once per cache, then comes from here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Configure, build and test
        run: python3 scripts/verify.py ${{ matrix.preset }} --tag ci
      # The GUI's tests play recordings of the launcher (gui/server/tests/recordings): are they still what this
      # launcher and the ecu_main example ECUs write? (Standard library only. Cases that need the control server
      # are skipped and said so: the preset is built without it.)
      - name: The GUI's recordings against this launcher
        if: matrix.preset == 'linux-gcc-release'
        run: python3 gui/server/tests/record_launcher.py --launcher build/linux-gcc-release/tools/launch/vehicle_sil_launch --compare
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: build/logs
          retention-days: 14

  # The oldest CMake that README.md asks for (3.21, its last release), so that every run checks that claim. Kitware's
  # own Linux build, checked against the SHA-256 that the release lists (cmake-3.21.7-SHA-256.txt).
  linux-oldest-cmake:
    name: linux (linux-gcc-release, CMake 3.21.7)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OLDEST: 3.21.7
      CMAKE_OLDEST_SHA256: f84e209d903a96e54f398bb8760693969b13fc50bce2f8278a9ee9dca01406b2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Ninja and ccache
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build ccache
      - name: CMake ${{ env.CMAKE_OLDEST }} instead of the runner's
        run: |
          archive="cmake-$CMAKE_OLDEST-linux-x86_64"
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/Kitware/CMake/releases/download/v$CMAKE_OLDEST/$archive.tar.gz"
          echo "$CMAKE_OLDEST_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive/bin" >> "$GITHUB_PATH"
      - name: Python environment (PyYAML for the code generator, gRPC for the Python tests)
        run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-gcc-release-cmake-${{ env.CMAKE_OLDEST }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-gcc-release-cmake-${{ env.CMAKE_OLDEST }}-
            ccache-linux-gcc-release-
      - name: Configure, build and test
        run: |
          cmake --version | head -n 1
          cmake --version | grep -qxF "cmake version $CMAKE_OLDEST"
          python3 scripts/verify.py linux-gcc-release --tag ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux-gcc-release-cmake-${{ env.CMAKE_OLDEST }}
          path: build/logs
          retention-days: 14

  windows:
    name: windows (windows-mingw-release)
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # The sources as they are in the repository (LF), as on Linux.
      - name: Keep LF line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-yaml
      - name: Where ccache keeps its files
        run: echo "CCACHE_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.ccache")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-mingw-release-${{ github.sha }}
          restore-keys: ccache-windows-mingw-release-
      # What the build takes: the MSYS2 packages first on PATH (path-type minimal). The runner also has a Python for
      # Windows, without PyYAML, that CMake's find_package(Python3) finds first (registry): the build then takes the
      # one on PATH (cmake/VehicleSilPython.cmake).
      - name: Tools
        run: |
          gcc --version | head -n 1
          cmake --version | head -n 1
          command -v python git
          python -c "import sys, yaml; print('Python', sys.version.split()[0], 'PyYAML', yaml.__version__)"
      # As many tests at once as the runner has CPUs (4), not the test preset's 8: on Windows, the tests with bounds on
      # real time have been checked with fewer tests at once than CPUs.
      - name: Configure, build and test
        run: python scripts/verify.py windows-mingw-release --tag ci --test-jobs 4
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-windows-mingw-release
          path: build/logs
          retention-days: 14

  gui:
    name: gui (server, screen, examples)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: gui/web/.nvmrc
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the packages and the browser of the end-to-end tests
        working-directory: gui/web
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Server, screen and examples
        run: python3 scripts/verify-gui.py --skip-install --tag ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-gui
          path: |
            build/logs
            gui/web/test-results
          retention-days: 14

  python:
    name: python (3.11, .python-version, lowest dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Python checks
        run: python3 scripts/verify-python.py --tag ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-python
          path: build/logs
          retention-days: 14
