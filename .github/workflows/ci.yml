# Checks of every push to main and every pull request: the C++ build and tests (Linux presets, one with the thread
# sanitizer, one with the control server, and one of them also
# with the oldest CMake that docs/build.md asks for, Windows with MSYS2 UCRT64), the browser GUI, and the Python code. Each job calls the repository's script that a developer
# runs (AGENTS.md, "検証とスクリプト"); on failure, its logs (build/logs) are kept as an artifact.
# Security: read-only token, no secrets, actions pinned by commit hash (the tag in the comment).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push replaces the run of a pull request. On main every merge keeps its own run (its group is
  # the commit): a merge that follows another within minutes must not cancel the run of the one before.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runners are small (4 CPUs): the tests' upper bounds of waiting for something that will happen are 3
# times as long (C++, the GUI server's and the screen's tests; a test that passes is not slower). The thread
# sanitizer's job leaves it empty, so that its preset's own default applies (VEHICLE_SIL_TEST_TIMEOUT_SCALE_DEFAULT in
# CMakePresets.json). scripts/verify.py runs no more tests at once than the runner has CPUs.
env:
  VEHICLE_SIL_TEST_TIMEOUT_SCALE: "3"

jobs:
  # A pull request that changes only Markdown files needs only the checks that read the documents: the links
  # (python), the examples that the launcher's tests compare with the documents (linux-gcc-debug), and the format
  # of the GUI's READMEs (gui). A push to main runs everything.
  changes:
    name: changes (documents only?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.look.outputs.docs_only }}
      presets: ${{ steps.look.outputs.presets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: look
        env:
          EVENT: ${{ github.event_name }}
        # The checkout of a pull request is its merge into the base: the first parent is the base.
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            if [ -n "$files" ] && ! grep -qv '\.md$' <<<"$files"; then docs_only=true; fi
          fi
          if [ "$docs_only" = true ]; then
            presets='["linux-gcc-debug"]'
          else
            presets='["linux-gcc-debug", "linux-gcc-release", "linux-gcc-static", "linux-clang-tsan", "linux-gcc-control"]'
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
          echo "presets=$presets" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    name: linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # linux-gcc-static: VEHICLE_SIL_STATIC=ON (SIL Kit and the C++ runtime linked into each executable)
        # linux-clang-tsan: the thread sanitizer; a race in a test or in the product shows only here
        # linux-gcc-control: VEHICLE_SIL_BUILD_CONTROL_SERVER=ON (the pinned gRPC built with FetchContent, the
        # control server's tests, and the GUI server against this launcher and its control server)
        preset: ${{ fromJSON(needs.changes.outputs.presets) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # gRPC, protobuf, abseil and BoringSSL are most of what linux-gcc-control compiles: it needs more room.
      CCACHE_MAXSIZE: ${{ matrix.preset == 'linux-gcc-control' && '2G' || '1G' }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Empty (not set) for the thread sanitizer: its preset's default factor (4) applies.
      VEHICLE_SIL_TEST_TIMEOUT_SCALE: ${{ matrix.preset != 'linux-clang-tsan' && '3' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # ethtool: ethernet_bridge.netns.packet turns an offload off with it.
      # libpcap0.8: ethernet_bridge.netns.pcap loads the library at run time (nothing is built against it).
      - name: Install Ninja, ccache, ethtool and libpcap
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build ccache ethtool libpcap0.8
      - name: Python environment (PyYAML for the code generator, gRPC for the Python tests)
        run: uv sync --locked
      # The thread sanitizer cannot map its shadow memory when the kernel randomizes addresses with more bits.
      - name: Address space layout for the thread sanitizer
        if: matrix.preset == 'linux-clang-tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28 && clang++ --version | head -n 1
      # multi_host.two_hosts makes two computers as network namespaces in a user namespace, which Ubuntu's AppArmor
      # does not let a user make by default; with VEHICLE_SIL_REQUIRE_MULTI_HOST=1 the test fails rather than skips.
      - name: User namespaces for the test of two computers
        if: matrix.preset == 'linux-gcc-release'
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Urnm true
      # The compiler cache: SIL Kit and everything else compiles once per cache, then comes from here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Configure, build and test
        env:
          VEHICLE_SIL_REQUIRE_MULTI_HOST: ${{ matrix.preset == 'linux-gcc-release' && '1' || '' }}
          # The Ethernet bridge on real interfaces (ethernet_bridge.netns.*): where the TAP device, the veth pair or
          # a packet socket cannot be made in the namespace, or setpriv or ethtool is missing, the test fails rather
          # than skips or leaves a part out, and its first line says what could not be made.
          VEHICLE_SIL_REQUIRE_ETHERNET_NETNS: ${{ matrix.preset == 'linux-gcc-release' && '1' || '' }}
        run: python3 scripts/verify.py ${{ matrix.preset }} --tag ci
      # The GUI's tests play recordings of the launcher (gui/server/tests/recordings): are they still what this
      # launcher and the ecu_main example ECUs write? (Standard library only. Cases that need the control server
      # are skipped and said so: the preset is built without it; linux-gcc-control compares them.)
      - name: The GUI's recordings against this launcher
        if: matrix.preset == 'linux-gcc-release'
        run: python3 gui/server/tests/record_launcher.py --launcher build/linux-gcc-release/tools/launch/vehicle_sil_launch --compare
      # The Python client's tests and the examples of examples/launch_control are added only where CMake finds a
      # Python with grpcio and grpcio-tools (here the uv environment); without one they would be left out silently.
      - name: The control server's Python tests were run
        if: matrix.preset == 'linux-gcc-control'
        run: |
          expected="control_server.python_client control_server.launcher control_server.example_write_before_start control_server.example_pause_and_step"
          listed=$(ctest --test-dir build/linux-gcc-control -N -L python)
          for name in $expected; do
            if ! grep -qE "Test +#[0-9]+: $name\$" <<<"$listed"; then
              echo "::error::$name is not registered: CMake found no Python 3.11+ with grpcio and grpcio-tools (see 'the Python client tests are skipped' in build/logs/ci-linux-gcc-control-configure.log); run uv sync --locked before the configure"
              exit 1
            fi
          done
      # The GUI server against this launcher and its control server (gui/server/tests/test_real_launcher.py records
      # every case again, those with the control server too, and compares; test_real_variables.py reads and writes
      # the example ECUs' variables). The screen and its browser tests are in the gui job (without a real launcher).
      - name: The GUI server against this launcher
        if: matrix.preset == 'linux-gcc-control'
        run: >-
          python3 scripts/verify-gui.py --skip-web --skip-e2e --no-wait --tag ci
          --launcher build/linux-gcc-control/tools/launch/vehicle_sil_launch
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: build/logs
          retention-days: 14

  # The oldest CMake that docs/build.md asks for (3.21, its last release), so that every run checks that claim. Kitware's
  # own Linux build, checked against the SHA-256 that the release lists (cmake-3.21.7-SHA-256.txt).
  linux-oldest-cmake:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: linux (linux-gcc-release, CMake 3.21.7)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OLDEST: 3.21.7
      CMAKE_OLDEST_SHA256: f84e209d903a96e54f398bb8760693969b13fc50bce2f8278a9ee9dca01406b2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Ninja and ccache
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build ccache
      - name: CMake ${{ env.CMAKE_OLDEST }} instead of the runner's
        run: |
          archive="cmake-$CMAKE_OLDEST-linux-x86_64"
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/Kitware/CMake/releases/download/v$CMAKE_OLDEST/$archive.tar.gz"
          echo "$CMAKE_OLDEST_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive/bin" >> "$GITHUB_PATH"
      - name: Python environment (PyYAML for the code generator, gRPC for the Python tests)
        run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-gcc-release-cmake-${{ env.CMAKE_OLDEST }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-gcc-release-cmake-${{ env.CMAKE_OLDEST }}-
            ccache-linux-gcc-release-
      - name: Configure, build and test
        run: |
          cmake --version | head -n 1
          cmake --version | grep -qxF "cmake version $CMAKE_OLDEST"
          python3 scripts/verify.py linux-gcc-release --tag ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux-gcc-release-cmake-${{ env.CMAKE_OLDEST }}
          path: build/logs
          retention-days: 14

  windows:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: windows (windows-mingw-release)
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # The sources as they are in the repository (LF), as on Linux.
      - name: Keep LF line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-yaml
      - name: Where ccache keeps its files
        run: echo "CCACHE_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.ccache")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-mingw-release-${{ github.sha }}
          restore-keys: ccache-windows-mingw-release-
      # What the build takes: the MSYS2 packages first on PATH (path-type minimal). The runner also has a Python for
      # Windows, without PyYAML, that CMake's find_package(Python3) finds first (registry): the build then takes the
      # one on PATH (cmake/VehicleSilPython.cmake).
      - name: Tools
        run: |
          gcc --version | head -n 1
          cmake --version | head -n 1
          command -v python git
          python -c "import sys, yaml; print('Python', sys.version.split()[0], 'PyYAML', yaml.__version__)"
      - name: Configure, build and test
        run: python scripts/verify.py windows-mingw-release --tag ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-windows-mingw-release
          path: build/logs
          retention-days: 14

  gui:
    needs: changes
    name: gui (server, screen, examples)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: gui/web/.nvmrc
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the packages
        working-directory: gui/web
        run: npm ci
      - name: Format of the documents (a pull request that changes only Markdown files)
        if: needs.changes.outputs.docs_only == 'true'
        working-directory: gui/web
        run: npm run format:check
      - name: Install the browser of the end-to-end tests
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: gui/web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Server, screen and examples
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 scripts/verify-gui.py --skip-install --tag ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-gui
          path: |
            build/logs
            gui/web/test-results
          retention-days: 14

  python:
    name: python (3.11, .python-version, lowest dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Links in the documents
        run: python3 scripts/check-docs.py
      - name: Python checks
        run: python3 scripts/verify-python.py --tag ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-python
          path: build/logs
          retention-days: 14
