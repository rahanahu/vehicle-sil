# Checks of every push to main and, in part, of every pull request (the job `changes` below says which part):
# the C++ build and tests (Linux presets, one with the thread
# sanitizer, one with the control server, and one of them also
# with the oldest CMake that docs/build.md asks for, Windows with MSYS2 UCRT64), the browser GUI, and the Python code. Each job calls the repository's script that a developer
# runs (AGENTS.md, "Verification and scripts"); on failure, its logs (build/logs) are kept as an artifact.
# The scripts also write their summary to the job's summary on the run's page (scripts/job_summary.py); a failure
# there names the artifact of its logs (VEHICLE_SIL_LOG_ARTIFACT).
# Security: read-only token, no secrets, actions pinned by commit hash (the tag in the comment).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push replaces the run of a pull request. On main a run is never stopped, but only one runs at a
  # time and only the newest waits: when several merges follow each other within minutes, the merges between
  # the running one and the newest get no run of their own (theirs is cancelled while it waits), and the
  # newest one's run checks them together. If it fails, run the ones between by hand to find which merge it was.
  # (release.yml wants this workflow's run on the tagged commit: re-run a cancelled one before tagging it.)
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runners are small (4 CPUs): the tests' upper bounds of waiting for something that will happen are 3
# times as long (C++, the GUI server's and the screen's tests; a test that passes is not slower). The thread
# sanitizer's job leaves it empty, so that its preset's own default applies (VEHICLE_SIL_TEST_TIMEOUT_SCALE_DEFAULT in
# CMakePresets.json). scripts/verify.py runs no more tests at once than the runner has CPUs.
env:
  VEHICLE_SIL_TEST_TIMEOUT_SCALE: "3"

jobs:
  # A pull request runs fewer jobs than a push to main, so that several open pull requests do not wait for
  # runners. A push to main (or workflow_dispatch) runs everything.
  # - Only Markdown files changed (excluding tools/knowledge/): the checks that read the documents: the links and
  #   the schema and template checks (python on .python-version only), the examples that the launcher's tests
  #   compare with the documents (linux-gcc-debug) when a changed page is in `debug_reads_docs`, linux-gcc-control
  #   when it is in `control_reads`, the format of the GUI's READMEs (gui) when a file is in gui/, the GUI server's
  #   tests (gui-server) and the timeline element's test (gui) when a file is in `gui_doc_reads`, and the client
  #   library package check (`npm run pack:client` in gui) when a file is in `pack_reads`.
  # - Only the browser GUI changed (gui/web, gui/client, gui/timeline, gui/protocol/examples, examples/gui_client,
  #   examples/gui_starter): gui, gui-server and python (plus linux-gcc-debug when a changed file is in `cpp_reads_gui`).
  #   When gui/server or gui/protocol/dashboard.schema.json changes without C++-tested docs, linux-gcc-control runs
  #   scoped to `^(launch\.shared_values|schema\.)` plus the real-launcher GUI tests (which already run
  #   record_launcher.py --compare), skipping linux-gcc-debug.
  # - Only non-GUI scripts (the `non_gui_scripts` allowlist) changed: python plus linux-gcc-debug and Windows
  #   scoped to `^(scripts|template)\.` (plus `^launch_run\.trace_files$` when scripts/trace-report.py changes),
  #   skipping gui, gui-server, linux-tsan and linux-gcc-control.
  # - Otherwise: linux-gcc-debug, linux-gcc-control, linux-tsan (the thread sanitizer), Windows and python. The presets
  #   linux-gcc-release and linux-gcc-static and the oldest CMake are added when the pull request changes how
  #   things are built (the `build` list below). Every check that only one preset makes is in linux-gcc-debug
  #   (two computers, the Ethernet bridge on real interfaces, the GUI's recordings), so the left-out jobs add
  #   the other build types only, and main still runs them after the merge.
  # - Only a push to main (or workflow_dispatch) adds linux-clang-asan (the address sanitizer). A leg that builds
  #   linux-gcc-release (a push to main, or a pull request that changes how things are built) also runs the test that
  #   builds the ECU project template with FetchContent.
  # - The gui jobs (gui and gui-server) are left out when every changed file is in the `not_gui` list below and none is
  #   in `gui_reads`, `gui_doc_reads` or `pack_reads`. Rule for the lists: a path outside gui/ that a test of the gui
  #   or gui-server job reads belongs in `gui_reads`, `gui_doc_reads` or `pack_reads`, never only in `not_gui`.
  # The job `all checks` at the end is the one required check of main's branch protection: keep its name. The
  # names of the other jobs may change.
  changes:
    name: changes (documents only?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.look.outputs.docs_only }}
      full: ${{ steps.look.outputs.full }}
      gui: ${{ steps.look.outputs.gui }}
      gui_server: ${{ steps.look.outputs.gui_server }}
      gui_docs: ${{ steps.look.outputs.gui_docs }}
      gui_pack_docs: ${{ steps.look.outputs.gui_pack_docs }}
      tsan: ${{ steps.look.outputs.tsan }}
      windows: ${{ steps.look.outputs.windows }}
      presets: ${{ steps.look.outputs.presets }}
      ctest_filter: ${{ steps.look.outputs.ctest_filter }}
      cpp_hash: ${{ steps.cpp-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: look
        env:
          EVENT: ${{ github.event_name }}
        # The checkout of a pull request is its merge into the base: the first parent is the base.
        run: |
          docs_only=false
          full=true
          gui=true
          gui_server=true
          gui_docs=false
          gui_pack_docs=false
          tsan=true
          windows=true
          ctest_filter=''
          # Paths outside gui/ that the gui and gui-server jobs' tests read: the launcher's reference timelines
          # (gui/timeline's and gui/web's tests) and the example dashboard and panels read by test_dashboard.py and
          # test_protocol_examples.py.
          gui_reads='^tests/launch/timeline/|^examples/ecu_main/(simulation\.dashboard\.yaml$|panels/)'
          # The manuals that the GUI server's tests and the timeline's test hold against the code.
          gui_doc_reads='^docs/(ja/)?gui\.md$|^gui/protocol/README(\.ja)?\.md$'
          # The READMEs whose ```ts code blocks gui/client/pack.mjs (npm run pack:client) type-checks.
          pack_reads='^(examples/gui_starter|gui/client)/README(\.ja)?\.md$'
          # The pages of docs/ that C++ tests in linux-gcc-debug hold against the examples and the outputs.
          debug_reads_docs='^docs/(simulation-(config|check|run|events)|scenario|ecu-executable|j1939-guide|howto/[^/]+)\.md$'
          # The guides that the control server's tests (tests/control_server) hold against the examples.
          control_reads='^docs/howto/(first-ecu|operate-signals)\.md$'
          # Files under gui/ that C++ build/tests read (tests/launch/test_shared_values.cpp, CMakeLists.txt, record_launcher.py, test_real_*.py).
          cpp_reads_gui='^gui/(server/|protocol/dashboard\.schema\.json$|client/src/(client|protocol/server)\.ts$|web/src/app/run/(speed-picker|run-page)\.ts$)'
          # Allowlist of scripts/ and script unit tests never executed or imported by gui/gui-server jobs.
          # Scripts shared with GUI jobs (verify-gui.py, verify-web.py, web_i18n.py, busy_machine.py, run-gui.py,
          # verify_common.py, job_summary.py) are intentionally omitted so changes to them still run gui/gui-server.
          non_gui_scripts='^scripts/(check-commits|check-docs|doctor|hotspots|mutate|package|trace-report|verify|verify-python)\.py$|^tests/scripts/test_[^/]+\.py$'
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            echo "$files"
            if [ -n "$files" ]; then
              if ! grep -qv '\.md$' <<<"$files" && ! grep -qE '^tools/knowledge/' <<<"$files"; then docs_only=true; fi
              build='(^|/)CMakeLists\.txt$|\.cmake$|^cmake/|(^|/)CMakePresets\.json$|^patches/|^external/|^\.gitmodules$|^\.github/'
              if ! grep -qE "$build" <<<"$files"; then full=false; fi
              not_gui="^(libs|tests|bridges|tools|cmake|patches|external|template|docs|schema)/|^examples/([^g]|g[^u]|gu[^i]|gui[^_])|(^|/)CMakeLists\\.txt$|^CMakePresets\\.json$|^\\.gitmodules$|$non_gui_scripts"
              if [ "$docs_only" = false ] && ! grep -qE "$gui_reads|$gui_doc_reads|$pack_reads" <<<"$files" && ! grep -qvE "$not_gui" <<<"$files"; then
                gui=false
                gui_server=false
              fi
              if [ "$docs_only" = false ] && [ "$gui" = true ] && ! grep -qvE "$not_gui" <<<"$files" && ! grep -qE '^tests/launch/timeline/|^docs/(ja/)?gui\.md$' <<<"$files"; then
                gui=false
                gui_server=true
              fi
              if [ "$docs_only" = true ]; then
                gui_server=false
                tsan=false
                windows=false
                if grep -qE "$gui_doc_reads" <<<"$files"; then
                  gui_docs=true
                  gui_server=true
                fi
                if grep -qE "$pack_reads" <<<"$files"; then gui_pack_docs=true; fi
                if ! grep -qE "^gui/|$gui_doc_reads|$pack_reads" <<<"$files"; then gui=false; fi
              fi
            fi
          fi
          if [ "$docs_only" = true ]; then
            presets='[]'
            if grep -qE "$control_reads" <<<"$files"; then
              presets='["linux-gcc-debug", "linux-gcc-control"]'
            elif grep -qE "$debug_reads_docs" <<<"$files"; then
              presets='["linux-gcc-debug"]'
            fi
          elif [ "$full" = true ]; then
            presets='["linux-gcc-debug", "linux-gcc-release", "linux-gcc-static", "linux-gcc-control"]'
          elif [ "$EVENT" = pull_request ] && [ -n "${files:-}" ] && ! grep -qvE '^tools/knowledge/' <<<"$files"; then
            presets='[]'
            tsan=false
            windows=false
            gui=false
            gui_server=false
          elif [ "$EVENT" = pull_request ] && [ -n "${files:-}" ] && ! grep -qvE "$non_gui_scripts" <<<"$files"; then
            presets='["linux-gcc-debug"]'
            if grep -qE '^scripts/trace-report\.py$' <<<"$files"; then
              ctest_filter='^(scripts|template)\.|^launch_run\.trace_files$'
            else
              ctest_filter='^(scripts|template)\.'
            fi
            tsan=false
            windows=true
            gui=false
            gui_server=false
          elif [ "$EVENT" = pull_request ] && [ -n "${files:-}" ] && ! grep -qvE '^(gui|examples/gui_(client|starter)|docs)/|\.md$' <<<"$files" && ! grep -qE "$cpp_reads_gui|$debug_reads_docs|$control_reads" <<<"$files"; then
            presets='[]'
            tsan=false
            windows=false
          elif [ "$EVENT" = pull_request ] && [ -n "${files:-}" ] && ! grep -qvE '^(gui|examples/gui_(client|starter)|docs)/|\.md$' <<<"$files" && ! grep -qE '^gui/(server/|protocol/dashboard\.schema\.json$)' <<<"$files" && ! grep -qE "$control_reads" <<<"$files"; then
            presets='["linux-gcc-debug"]'
            tsan=false
            windows=false
          elif [ "$EVENT" = pull_request ] && [ -n "${files:-}" ] && ! grep -qvE '^(gui|examples/gui_(client|starter)|docs)/|\.md$' <<<"$files" && ! grep -qE "$debug_reads_docs|$control_reads" <<<"$files"; then
            presets='["linux-gcc-control"]'
            ctest_filter='^(launch\.shared_values|schema\.)'
            tsan=false
            windows=false
          elif [ "$EVENT" = pull_request ] && [ -n "${files:-}" ] && ! grep -qvE '^(gui|examples/gui_(client|starter)|docs)/|\.md$' <<<"$files"; then
            presets='["linux-gcc-debug", "linux-gcc-control"]'
            tsan=false
            windows=false
          else
            presets='["linux-gcc-debug", "linux-gcc-control"]'
          fi
          # The address sanitizer only after a merge: a pull request is not held for it (the job `all checks` still
          # looks at it, so that a failure on main shows).
          if [ "$EVENT" != pull_request ]; then
            presets=${presets%]}', "linux-clang-asan"]'
          fi
          {
            echo "docs_only=$docs_only"
            echo "full=$full"
            echo "gui=$gui"
            echo "gui_server=$gui_server"
            echo "gui_docs=$gui_docs"
            echo "gui_pack_docs=$gui_pack_docs"
            echo "tsan=$tsan"
            echo "windows=$windows"
            echo "presets=$presets"
            echo "ctest_filter=$ctest_filter"
          } | tee -a "$GITHUB_OUTPUT"
      - name: C++ build input hash
        id: cpp-hash
        run: |
          trees=$(git rev-parse \
            HEAD:.github/workflows/ci.yml \
            HEAD:CMakeLists.txt \
            HEAD:CMakePresets.json \
            HEAD:.gitmodules \
            HEAD:cmake \
            HEAD:external \
            HEAD:patches \
            HEAD:proto \
            HEAD:libs \
            HEAD:tools \
            HEAD:bridges \
            HEAD:tests \
            HEAD:examples)
          hash=$(printf '%s\n' "$trees" | sha256sum | cut -c1-16)
          test -n "$hash"
          echo "hash=$hash" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    if: needs.changes.outputs.presets != '[]'
    name: linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # linux-gcc-static: VEHICLE_SIL_STATIC=ON (SIL Kit and the C++ runtime linked into each executable)
        # linux-clang-asan: the address sanitizer (a push to main only)
        # (the thread sanitizer is the job linux-tsan below)
        # linux-gcc-control: VEHICLE_SIL_BUILD_CONTROL_SERVER=ON (the pinned gRPC built with FetchContent, the
        # control server's tests, and the GUI server's real-launcher tests against this launcher and its control server)
        preset: ${{ fromJSON(needs.changes.outputs.presets) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESSLEVEL: "6"
      # gRPC, protobuf, abseil and BoringSSL are most of what linux-gcc-control compiles (FetchContent gRPC uses -g0
      # and CI Debug/Sanitizer presets use -g1 to stay within the repository cache budget). ASan uses 700M so
      # incremental builds have headroom without cleanups while staying inside GitHub's 10 GiB cache limit.
      CCACHE_MAXSIZE: ${{ matrix.preset == 'linux-gcc-control' && '1.3G' || matrix.preset == 'linux-clang-asan' && '700M' || matrix.preset == 'linux-gcc-static' && '200M' || '500M' }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      VEHICLE_SIL_LOG_ARTIFACT: logs-${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Runner image version
        id: runner-img
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-tools
        with:
          path: ~/.cache/apt-debs/linux-tools
          key: apt-linux-tools-ubuntu2404-${{ steps.runner-img.outputs.version }}
      # ethtool: ethernet_bridge.netns.packet turns an offload off with it.
      # libpcap0.8: ethernet_bridge.netns.pcap loads the library at run time (nothing is built against it).
      - name: Install Ninja, ccache, ethtool and libpcap
        run: |
          deb_dir="$HOME/.cache/apt-debs/linux-tools"
          mkdir -p "$deb_dir"
          ok=false
          if [ "${{ steps.apt-tools.outputs.cache-hit }}" = "true" ] && compgen -G "$deb_dir/*.deb" > /dev/null; then
            if sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive dpkg -i --no-triggers "$deb_dir"/*.deb &&
               sudo ldconfig &&
               dpkg -s ninja-build ccache ethtool > /dev/null 2>&1 &&
               (dpkg -s libpcap0.8t64 > /dev/null 2>&1 || dpkg -s libpcap0.8 > /dev/null 2>&1); then
              ok=true
            fi
          fi
          if [ "$ok" != "true" ]; then
            rm -f "$deb_dir"/*.deb
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            mkdir -p "$deb_dir/partial"
            sudo apt-get update -q -o Acquire::Languages=none
            sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -f -y -q \
              -o Dir::Cache::archives="$deb_dir" \
              -o APT::Keep-Downloaded-Packages=true \
              ninja-build ccache ethtool libpcap0.8
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            sudo chown -R "$(id -u):$(id -g)" "$deb_dir"
          fi
      - name: Python environment (PyYAML for the code generator, gRPC for the Python tests)
        run: uv sync --locked
      # A pull request builds the control server against Ubuntu's gRPC (find_package finds it), so that it does
      # not wait for the build of gRPC when the compiler cache has gone. A push to main installs nothing here
      # and builds the pinned version with FetchContent, as a user without gRPC does, while warming the
      # apt-grpc cache (download-only) so first pushes of pull requests hit main's cache instead of apt mirrors.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-grpc
        if: matrix.preset == 'linux-gcc-control' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        with:
          path: ~/.cache/apt-debs/grpc
          key: apt-grpc-ubuntu2404-${{ steps.runner-img.outputs.version }}
          lookup-only: ${{ github.event_name != 'pull_request' }}
      - name: Warm gRPC package cache (main)
        if: matrix.preset == 'linux-gcc-control' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.apt-grpc.outputs.cache-hit != 'true'
        run: |
          deb_dir="$HOME/.cache/apt-debs/grpc"
          rm -rf "$deb_dir"
          mkdir -p "$deb_dir/partial"
          sudo apt-get update -q -o Acquire::Languages=none
          sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -y -q --download-only --no-install-recommends \
            -o Dir::Cache::archives="$deb_dir" \
            -o APT::Keep-Downloaded-Packages=true \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
          sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
          sudo chown -R "$(id -u):$(id -g)" "$deb_dir"
          compgen -G "$deb_dir/*.deb" > /dev/null
      - name: gRPC of the distribution (pull requests)
        if: matrix.preset == 'linux-gcc-control' && github.event_name == 'pull_request'
        run: |
          deb_dir="$HOME/.cache/apt-debs/grpc"
          mkdir -p "$deb_dir"
          ok=false
          if [ "${{ steps.apt-grpc.outputs.cache-hit }}" = "true" ] && compgen -G "$deb_dir/*.deb" > /dev/null; then
            if sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive dpkg -i --no-triggers "$deb_dir"/*.deb &&
               sudo ldconfig &&
               dpkg -s libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc > /dev/null 2>&1; then
              ok=true
            fi
          fi
          if [ "$ok" != "true" ]; then
            rm -f "$deb_dir"/*.deb
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            mkdir -p "$deb_dir/partial"
            sudo apt-get update -q -o Acquire::Languages=none
            sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -f -y -q --no-install-recommends \
              -o Dir::Cache::archives="$deb_dir" \
              -o APT::Keep-Downloaded-Packages=true \
              libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            sudo chown -R "$(id -u):$(id -g)" "$deb_dir"
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.preset == 'linux-gcc-control' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && steps.apt-grpc.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/apt-debs/grpc
          key: apt-grpc-ubuntu2404-${{ steps.runner-img.outputs.version }}
      # The sanitizers cannot map their shadow memory when the kernel randomizes addresses with more bits.
      - name: Address space layout for the sanitizers
        if: matrix.preset == 'linux-clang-asan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28 && clang++ --version | head -n 1
      # multi_host.two_hosts makes two computers as network namespaces in a user namespace, which Ubuntu's AppArmor
      # does not let a user make by default; with VEHICLE_SIL_REQUIRE_MULTI_HOST=1 the test fails rather than skips.
      - name: User namespaces for the test of two computers
        if: matrix.preset == 'linux-gcc-debug'
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Urnm true
      # socketcan_bridge.netns.* makes a virtual CAN interface (vcan0) in a network namespace: the kernel needs the
      # modules vcan and can_raw. Where the image does not have them, linux-modules-extra of the running kernel does.
      - name: Virtual CAN for the SocketCAN bridge tests
        if: matrix.preset == 'linux-gcc-debug'
        run: |
          sudo modprobe -a vcan can_raw || {
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe -a vcan can_raw
          }
      - name: gRPC version
        id: grpc-ver
        if: matrix.preset == 'linux-gcc-control' && github.event_name != 'pull_request'
        run: |
          ver=$(sed -n 's/^set(VEHICLE_SIL_GRPC_VERSION "\([^"]*\)".*/\1/p' cmake/VehicleSilGrpc.cmake)
          test -n "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: grpc-src
        if: matrix.preset == 'linux-gcc-control' && github.event_name != 'pull_request'
        with:
          path: ~/.cache/grpc-src
          key: grpc-src-${{ steps.grpc-ver.outputs.version }}
      # The compiler cache: SIL Kit and everything else compiles once per cache, then comes from here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ccache-restore
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ steps.runner-img.outputs.version }}-${{ needs.changes.outputs.cpp_hash }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Zero compiler cache statistics
        run: ccache -z
      - name: Configure, build and test
        env:
          CTEST_FILTER: ${{ needs.changes.outputs.ctest_filter }}
          VEHICLE_SIL_REQUIRE_MULTI_HOST: ${{ matrix.preset == 'linux-gcc-debug' && '1' || '' }}
          # The Ethernet bridge on real interfaces (ethernet_bridge.netns.*): where the TAP device, the veth pair or
          # a packet socket cannot be made in the namespace, or setpriv or ethtool is missing, the test fails rather
          # than skips or leaves a part out, and its first line says what could not be made.
          VEHICLE_SIL_REQUIRE_ETHERNET_NETNS: ${{ matrix.preset == 'linux-gcc-debug' && '1' || '' }}
          # The SocketCAN bridge on vcan0 (socketcan_bridge.netns.*): where vcan0 or a CAN socket cannot be made in the
          # namespace, the test fails rather than skips.
          VEHICLE_SIL_REQUIRE_SOCKETCAN: ${{ matrix.preset == 'linux-gcc-debug' && '1' || '' }}
        run: |
          extra=()
          case "${{ matrix.preset }}" in
            linux-gcc-debug|linux-gcc-control)
              extra+=(--cmake-arg=-DCMAKE_C_FLAGS_DEBUG=-g1 --cmake-arg=-DCMAKE_CXX_FLAGS_DEBUG=-g1)
              ;;
            linux-clang-asan)
              extra+=(--cmake-arg="-DCMAKE_C_FLAGS_DEBUG=-O1 -g1" --cmake-arg="-DCMAKE_CXX_FLAGS_DEBUG=-O1 -g1")
              ;;
          esac
          if [ -n "$CTEST_FILTER" ]; then
            extra+=(--tests "$CTEST_FILTER")
          else
            extra+=(--cmake-arg=-DVEHICLE_SIL_BATCH_UNIT_TESTS=ON)
          fi
          if [ "${{ matrix.preset }}" = "linux-gcc-control" ] && [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ steps.grpc-src.outputs.cache-hit }}" = "true" ]; then
            mkdir -p build/linux-gcc-control/_deps
            rm -rf build/linux-gcc-control/_deps/grpc-src
            mv "$HOME/.cache/grpc-src" build/linux-gcc-control/_deps/grpc-src
            extra+=(--cmake-arg="-DFETCHCONTENT_SOURCE_DIR_GRPC=${{ github.workspace }}/build/linux-gcc-control/_deps/grpc-src")
          fi
          python3 scripts/verify.py ${{ matrix.preset }} --tag ci "${extra[@]}"
      - name: Populate gRPC source cache
        if: matrix.preset == 'linux-gcc-control' && github.event_name != 'pull_request' && steps.grpc-src.outputs.cache-hit != 'true'
        run: |
          if [ -d build/linux-gcc-control/_deps/grpc-src ]; then
            rm -rf "$HOME/.cache/grpc-src"
            mkdir -p "$HOME/.cache/grpc-src"
            tar -C build/linux-gcc-control/_deps/grpc-src --exclude=.git -cf - . | tar -C "$HOME/.cache/grpc-src" -xf -
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.preset == 'linux-gcc-control' && github.event_name != 'pull_request' && steps.grpc-src.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/grpc-src
          key: grpc-src-${{ steps.grpc-ver.outputs.version }}
      # The ECU project template built the way a user builds it: FetchContent takes vehicle-sil from this checkout
      # (no network), the simulation is checked and run with this build's launcher, and its output is held against
      # the manual. Only the leg that builds the release type, so that it runs where a build change can break
      # it. fetchcontent.consumer (a clone from a git URL) is not run. The configure keeps the cache of the step
      # before and adds the option; the build that follows has nothing new to build in this tree.
      - name: The template built with FetchContent
        if: matrix.preset == 'linux-gcc-release'
        run: |
          cmake --preset linux-gcc-release -DVEHICLE_SIL_WARNINGS_AS_ERRORS=ON -DVEHICLE_SIL_TEST_FETCHCONTENT=ON -DCMAKE_C_FLAGS_DEBUG=-g1 -DCMAKE_CXX_FLAGS_DEBUG=-g1
          python3 scripts/verify.py linux-gcc-release --no-configure --tests '^fetchcontent\.template$' --tag ci-fetchcontent
      # The GUI's tests play recordings of the launcher (gui/server/tests/recordings): linux-gcc-control compares
      # every case (including the control server) inside test_real_launcher.py; here we smoke-check a non-control
      # build (version --json omitting control-server/scenario-control/scenario-time via control-scenario-passes,
      # plus check and run).
      - name: The GUI's recordings against this launcher
        if: matrix.preset == 'linux-gcc-debug' && needs.changes.outputs.ctest_filter == ''
        run: >-
          python3 gui/server/tests/record_launcher.py
          --launcher build/linux-gcc-debug/tools/launch/vehicle_sil_launch
          --compare version check-simulation run-simulation control-scenario-passes
      # The Python client's tests and the examples of examples/launch_control are added only where CMake finds a
      # Python with grpcio and grpcio-tools (here the uv environment); without one they would be left out silently.
      - name: The control server's Python tests were run
        if: matrix.preset == 'linux-gcc-control'
        run: |
          expected="control_server.python_client control_server.launcher control_server.example_write_before_start control_server.example_pause_and_step"
          listed=$(ctest --test-dir build/linux-gcc-control -N -L python)
          for name in $expected; do
            if ! grep -qE "Test +#[0-9]+: $name\$" <<<"$listed"; then
              echo "::error::$name is not registered: CMake found no Python 3.11+ with grpcio and grpcio-tools (see 'the Python client tests are skipped' in build/logs/ci-linux-gcc-control-configure.log); run uv sync --locked before the configure"
              exit 1
            fi
          done
      # schema.files_and_launcher is the only test that holds the keys of the JSON Schemas (schema/) against the
      # launcher's readers. It is added only where CMake finds a Python with PyYAML and jsonschema (here the uv
      # environment); without one it would be left out silently, and the schemas could drift from the launcher.
      - name: The test of the JSON Schemas against the launcher was run
        if: matrix.preset == 'linux-gcc-debug'
        run: |
          listed=$(ctest --test-dir build/linux-gcc-debug -N -R '^schema\.')
          if ! grep -qE 'Test +#[0-9]+: schema\.files_and_launcher$' <<<"$listed"; then
            echo "::error::schema.files_and_launcher is not registered: CMake found no Python 3.11+ with PyYAML and jsonschema (see 'the tests of the JSON Schemas are skipped' in build/logs/ci-linux-gcc-debug-configure.log), or the launcher and the examples of examples/ecu_main were not built; run uv sync --locked (its dev group has both) before the configure"
            exit 1
          fi
      # The GUI server's real-launcher tests against this launcher and its control server (gui/server/tests/test_real_launcher.py
      # records every case again, those with the control server too, and compares; test_real_text_check.py checks unsaved
      # text and saving; test_real_variables.py reads and writes the example ECUs' variables). The tests against the
      # stand-in launcher run in gui-server, and the screen and its browser tests in gui.
      - name: The GUI server against this launcher
        if: matrix.preset == 'linux-gcc-control'
        run: >-
          python3 scripts/verify-gui.py --skip-web --skip-e2e --no-wait --no-sync -k test_real_ --workers 4 --tag ci
          --launcher build/linux-gcc-control/tools/launch/vehicle_sil_launch
      - name: Compiler cache statistics and cleanup
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ steps.ccache-restore.outputs.cache-hit }}" != "true" ]; then
            ccache --evict-older-than 7d
            ccache -c
          fi
          ccache -s
      # Only a run on main saves the compiler cache, and only when the C++ input hash missed (so non-C++ merges
      # do not re-upload 2+ GiB and evict other caches). A pull request reads the newest one of main.
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ steps.runner-img.outputs.version }}-${{ needs.changes.outputs.cpp_hash }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: build/logs
          retention-days: 14

  # The thread sanitizer (linux-clang-tsan): a race in a test or in the product shows only here. Not in the matrix of
  # `linux`, so that `all checks` does not wait for it in a pull request: there a race is reported (the job's check
  # shows its failure) but does not hold the merge, and its result stays a success (continue-on-error). On main it
  # counts: a failure fails the run, and release.yml, which wants this workflow's run to have passed, stays shut.
  # `all checks` does not list it (tests/scripts/test_ci_workflow.py knows this one exception).
  linux-tsan:
    needs: changes
    if: needs.changes.outputs.tsan == 'true'
    name: linux (linux-clang-tsan)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: 700M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Empty (not set): the preset's default factor (4) applies.
      VEHICLE_SIL_TEST_TIMEOUT_SCALE: ""
      VEHICLE_SIL_LOG_ARTIFACT: logs-linux-clang-tsan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Runner image version
        id: runner-img
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-tools
        with:
          path: ~/.cache/apt-debs/linux-tools
          key: apt-linux-tools-ubuntu2404-${{ steps.runner-img.outputs.version }}
      - name: Install Ninja, ccache, ethtool and libpcap
        run: |
          deb_dir="$HOME/.cache/apt-debs/linux-tools"
          mkdir -p "$deb_dir"
          ok=false
          if [ "${{ steps.apt-tools.outputs.cache-hit }}" = "true" ] && compgen -G "$deb_dir/*.deb" > /dev/null; then
            if sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive dpkg -i --no-triggers "$deb_dir"/*.deb &&
               sudo ldconfig &&
               dpkg -s ninja-build ccache ethtool > /dev/null 2>&1 &&
               (dpkg -s libpcap0.8t64 > /dev/null 2>&1 || dpkg -s libpcap0.8 > /dev/null 2>&1); then
              ok=true
            fi
          fi
          if [ "$ok" != "true" ]; then
            rm -f "$deb_dir"/*.deb
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            mkdir -p "$deb_dir/partial"
            sudo apt-get update -q -o Acquire::Languages=none
            sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -f -y -q \
              -o Dir::Cache::archives="$deb_dir" \
              -o APT::Keep-Downloaded-Packages=true \
              ninja-build ccache ethtool libpcap0.8
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            sudo chown -R "$(id -u):$(id -g)" "$deb_dir"
          fi
      - name: Python environment (PyYAML for the code generator, gRPC for the Python tests)
        run: uv sync --locked
      # The sanitizers cannot map their shadow memory when the kernel randomizes addresses with more bits.
      - name: Address space layout for the sanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28 && clang++ --version | head -n 1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ccache-restore
        with:
          path: .ccache
          key: ccache-linux-clang-tsan-${{ steps.runner-img.outputs.version }}-${{ needs.changes.outputs.cpp_hash }}
          restore-keys: ccache-linux-clang-tsan-
      - name: Zero compiler cache statistics
        run: ccache -z
      # Keep VEHICLE_SIL_BATCH_UNIT_TESTS=OFF on TSan: libstdc++'s trivial ~std::mutex() never calls
      # pthread_mutex_destroy(), so TSan's deadlock detector retains destroyed stack mutex addresses across
      # sequential TEST_CASE calls in one process and can report phantom lock-order inversions.
      - name: Configure, build and test
        run: >-
          python3 scripts/verify.py linux-clang-tsan --tag ci
          --cmake-arg="-DCMAKE_C_FLAGS_DEBUG=-O1 -g1"
          --cmake-arg="-DCMAKE_CXX_FLAGS_DEBUG=-O1 -g1"
      - name: Compiler cache statistics and cleanup
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ steps.ccache-restore.outputs.cache-hit }}" != "true" ]; then
            ccache --evict-older-than 7d
            ccache -c
          fi
          ccache -s
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-clang-tsan-${{ steps.runner-img.outputs.version }}-${{ needs.changes.outputs.cpp_hash }}
      - name: Warn on PR TSan failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo "::warning::linux-clang-tsan failed (unwaited on PR; will fail main after merge)"
          {
            echo "> [!WARNING]"
            echo "> **linux-clang-tsan failed on this PR.** Because \`linux-tsan\` uses \`continue-on-error\` on pull requests, \`all checks\` does not wait for it — **merging this PR as-is will fail \`main\` CI** and block releases. Inspect \`logs-linux-clang-tsan\` before merging."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux-clang-tsan
          path: build/logs
          retention-days: 14

  # The oldest CMake that docs/build.md asks for (3.21, its last release), so that every run checks that claim. Kitware's
  # own Linux build, checked against the SHA-256 that the release lists (cmake-3.21.7-SHA-256.txt).
  linux-oldest-cmake:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.full == 'true'
    name: linux (linux-gcc-release, CMake 3.21.7)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: 150M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OLDEST: 3.21.7
      CMAKE_OLDEST_SHA256: f84e209d903a96e54f398bb8760693969b13fc50bce2f8278a9ee9dca01406b2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Runner image version
        id: runner-img
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-tools
        with:
          path: ~/.cache/apt-debs/linux-tools
          key: apt-linux-tools-ubuntu2404-${{ steps.runner-img.outputs.version }}
      - name: Install Ninja, ccache, ethtool and libpcap
        run: |
          deb_dir="$HOME/.cache/apt-debs/linux-tools"
          mkdir -p "$deb_dir"
          ok=false
          if [ "${{ steps.apt-tools.outputs.cache-hit }}" = "true" ] && compgen -G "$deb_dir/*.deb" > /dev/null; then
            if sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive dpkg -i --no-triggers "$deb_dir"/*.deb &&
               sudo ldconfig &&
               dpkg -s ninja-build ccache ethtool > /dev/null 2>&1 &&
               (dpkg -s libpcap0.8t64 > /dev/null 2>&1 || dpkg -s libpcap0.8 > /dev/null 2>&1); then
              ok=true
            fi
          fi
          if [ "$ok" != "true" ]; then
            rm -f "$deb_dir"/*.deb
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            mkdir -p "$deb_dir/partial"
            sudo apt-get update -q -o Acquire::Languages=none
            sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -f -y -q \
              -o Dir::Cache::archives="$deb_dir" \
              -o APT::Keep-Downloaded-Packages=true \
              ninja-build ccache ethtool libpcap0.8
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            sudo chown -R "$(id -u):$(id -g)" "$deb_dir"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cmake
          key: cmake-${{ env.CMAKE_OLDEST }}-linux-x86_64
      - name: CMake ${{ env.CMAKE_OLDEST }} instead of the runner's
        run: |
          archive="cmake-$CMAKE_OLDEST-linux-x86_64"
          cached="$HOME/.cache/cmake/$archive.tar.gz"
          mkdir -p "$HOME/.cache/cmake"
          if [ ! -f "$cached" ]; then
            curl -fsSL -o "$cached" \
              "https://github.com/Kitware/CMake/releases/download/v$CMAKE_OLDEST/$archive.tar.gz"
          fi
          echo "$CMAKE_OLDEST_SHA256  $cached" | sha256sum --check --strict -
          tar -xzf "$cached" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive/bin" >> "$GITHUB_PATH"
      - name: Python environment (PyYAML for the code generator, gRPC for the Python tests)
        run: uv sync --locked
      # Dedicated compiler cache for CMake 3.21.7 (CMake 3.21 vs 3.28+ flag/CMP0128 diffs miss the 3.28+ Release cache).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ccache-restore
        with:
          path: .ccache
          key: ccache-linux-oldest-cmake-${{ steps.runner-img.outputs.version }}-${{ needs.changes.outputs.cpp_hash }}
          restore-keys: ccache-linux-oldest-cmake-
      - name: Zero compiler cache statistics
        run: ccache -z
      - name: Configure, build and test
        env:
          VEHICLE_SIL_LOG_ARTIFACT: logs-linux-gcc-release-cmake-${{ env.CMAKE_OLDEST }}
        run: |
          cmake --version | head -n 1
          cmake --version | grep -qxF "cmake version $CMAKE_OLDEST"
          python3 scripts/verify.py linux-gcc-release --tag ci --cmake-arg=-DVEHICLE_SIL_BATCH_UNIT_TESTS=ON
      - name: Compiler cache statistics and cleanup
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ steps.ccache-restore.outputs.cache-hit }}" != "true" ]; then
            ccache --evict-older-than 7d
            ccache -c
          fi
          ccache -s
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-oldest-cmake-${{ steps.runner-img.outputs.version }}-${{ needs.changes.outputs.cpp_hash }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux-gcc-release-cmake-${{ env.CMAKE_OLDEST }}
          path: build/logs
          retention-days: 14

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: windows (windows-mingw-release)
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: 350M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      VEHICLE_SIL_LOG_ARTIFACT: logs-windows-mingw-release
      MSYS2_PACKAGES: >-
        git
        mingw-w64-ucrt-x86_64-gcc
        mingw-w64-ucrt-x86_64-cmake
        mingw-w64-ucrt-x86_64-ninja
        mingw-w64-ucrt-x86_64-ccache
        mingw-w64-ucrt-x86_64-python
        mingw-w64-ucrt-x86_64-python-yaml
        mingw-w64-ucrt-x86_64-python-jsonschema
    steps:
      # The sources as they are in the repository (LF), as on Linux.
      - name: Keep LF line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Exclude build and MSYS2 directories from Defender
        shell: pwsh
        run: |
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, 'C:\msys64')) {
            if ($p -and (Test-Path $p)) {
              try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { Write-Host "Defender exclusion skipped for ${p}: $_" }
            }
          }
      - name: Runner image version
        id: runner-img
        shell: pwsh
        run: |
          $ver = if ($env:ImageVersion) { $env:ImageVersion } else { 'unknown' }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: MSYS2 package key
        id: msys2-key
        shell: pwsh
        run: |
          $norm = ($env:MSYS2_PACKAGES -split '\s+' | Where-Object { $_ }) -join ' '
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($norm)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try { $digest = $sha.ComputeHash($bytes) } finally { $sha.Dispose() }
          $hash = ([System.BitConverter]::ToString($digest) -replace '-', '').ToLowerInvariant().Substring(0, 12)
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore MSYS2 environment
        id: msys2-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\msys64
          key: msys64-ucrt64-v1-${{ steps.runner-img.outputs.version }}-${{ steps.msys2-key.outputs.hash }}
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: steps.msys2-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: ${{ env.MSYS2_PACKAGES }}
      - name: Clean MSYS2 package cache before saving
        if: steps.msys2-cache.outputs.cache-hit != 'true'
        run: rm -rf /var/cache/pacman/pkg/*
      - name: Save MSYS2 environment
        if: steps.msys2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\msys64
          key: msys64-ucrt64-v1-${{ steps.runner-img.outputs.version }}-${{ steps.msys2-key.outputs.hash }}
      - name: Configure cached MSYS2 shell
        if: steps.msys2-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $msysRoot = Join-Path $env:RUNNER_TEMP 'msys64'
          $wrapDir = Join-Path $env:RUNNER_TEMP 'setup-msys2'
          New-Item -ItemType Directory -Force -Path $wrapDir | Out-Null
          $cmd = @(
            '@echo off',
            'setlocal',
            'IF NOT DEFINED MSYSTEM set MSYSTEM=UCRT64',
            'IF NOT DEFINED MSYS2_PATH_TYPE set MSYS2_PATH_TYPE=minimal',
            'set CHERE_INVOKING=1',
            "$msysRoot\usr\bin\bash.exe -leo pipefail %*"
          ) -join "`r`n"
          Set-Content -Path (Join-Path $wrapDir 'msys2.cmd') -Value ($cmd + "`r`n") -Encoding Ascii -NoNewline
          $wrapDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'MSYSTEM=UCRT64' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Where ccache keeps its files
        run: echo "CCACHE_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.ccache")" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ccache-restore
        with:
          path: .ccache
          key: ccache-windows-mingw-release-${{ steps.runner-img.outputs.version }}-${{ steps.msys2-key.outputs.hash }}-${{ needs.changes.outputs.cpp_hash }}
          restore-keys: ccache-windows-mingw-release-
      - name: Zero compiler cache statistics
        run: ccache -z
      # What the build takes: the MSYS2 packages first on PATH (path-type minimal). The runner also has a Python for
      # Windows, without PyYAML, that CMake's find_package(Python3) finds first (registry): the build then takes the
      # one on PATH (cmake/VehicleSilPython.cmake).
      - name: Tools
        run: |
          gcc --version | head -n 1
          cmake --version | head -n 1
          command -v python git
          python -c "import sys, yaml; print('Python', sys.version.split()[0], 'PyYAML', yaml.__version__)"
          python -c "import jsonschema, importlib.metadata; print('jsonschema', importlib.metadata.version('jsonschema'))"
      - name: Configure, build and test
        env:
          CTEST_FILTER: ${{ needs.changes.outputs.ctest_filter }}
        run: |
          extra=()
          if [ -n "$CTEST_FILTER" ]; then
            extra+=(--tests "$CTEST_FILTER")
          else
            extra+=(--cmake-arg=-DVEHICLE_SIL_BATCH_UNIT_TESTS=ON)
          fi
          python scripts/verify.py windows-mingw-release --tag ci "${extra[@]}"
      - name: Compiler cache statistics and cleanup
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ steps.ccache-restore.outputs.cache-hit }}" != "true" ]; then
            ccache --evict-older-than 7d
            ccache -c
          fi
          ccache -s
      # Only a run on main saves the compiler cache, and only when the C++ input hash missed (so non-C++ merges
      # do not re-upload and evict other caches). A pull request reads the newest one of main.
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-mingw-release-${{ steps.runner-img.outputs.version }}-${{ steps.msys2-key.outputs.hash }}-${{ needs.changes.outputs.cpp_hash }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-windows-mingw-release
          path: build/logs
          retention-days: 14

  gui:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    name: gui (screen, examples, workbench)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VEHICLE_SIL_LOG_ARTIFACT: logs-gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: gui/web/.nvmrc
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: web-node-modules
        with:
          path: gui/web/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('gui/web/package-lock.json') }}
      - name: Install the packages
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: gui/web
        run: npm ci
      - name: Format of the documents (a pull request that changes only Markdown files)
        if: needs.changes.outputs.docs_only == 'true'
        working-directory: gui/web
        run: npm run format:check
      - name: Runner image version
        id: runner-img
        if: needs.changes.outputs.docs_only != 'true'
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Playwright version
        id: pw-ver
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          ver=$(node -p "require('./gui/web/package-lock.json').packages['node_modules/playwright-core'].version")
          test -n "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-pw
        if: needs.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/apt-debs/playwright
          key: apt-pw-ubuntu2404-${{ steps.runner-img.outputs.version }}-${{ steps.pw-ver.outputs.version }}
      - name: Install the browser of the end-to-end tests
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: gui/web
        run: |
          deb_dir="$HOME/.cache/apt-debs/playwright"
          mkdir -p "$deb_dir"
          ok=false
          if [ "${{ steps.apt-pw.outputs.cache-hit }}" = "true" ] && compgen -G "$deb_dir/*.deb" > /dev/null; then
            if sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive dpkg -i --no-triggers "$deb_dir"/*.deb &&
               sudo ldconfig &&
               (! command -v fc-cache > /dev/null 2>&1 || sudo fc-cache) &&
               npx playwright install-deps --dry-run chromium > /dev/null 2>&1; then
              ok=true
            else
              sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get update -q -o Acquire::Languages=none
              sudo env NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -f -y -q
            fi
          fi
          if [ "$ok" != "true" ]; then
            rm -f "$deb_dir"/*.deb
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            mkdir -p "$deb_dir/partial"
            trap 'sudo rm -f /etc/apt/apt.conf.d/99keep-debs' EXIT
            printf 'Dir::Cache::archives "%s";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' "$deb_dir" \
              | sudo tee /etc/apt/apt.conf.d/99keep-debs > /dev/null
            npx playwright install-deps chromium
            sudo rm -f /etc/apt/apt.conf.d/99keep-debs
            trap - EXIT
            sudo rm -rf "$deb_dir/partial" "$deb_dir/lock"
            sudo chown -R "$(id -u):$(id -g)" "$deb_dir"
          fi
          npx playwright install --only-shell chromium
      # The server's tests run in the job gui-server at the same time (the two take about as long as each other).
      - name: Screen and examples
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 scripts/verify-gui.py --skip-server --skip-install --no-wait --tag ci
      # The Workbench example (gui/web/workbench) has its own packages and build, and its browser tests skip
      # themselves unless VEHICLE_SIL_VERIFY_WORKBENCH is set (verify-web.py --workbench sets it).
      - name: Install the packages of the Workbench
        if: needs.changes.outputs.docs_only != 'true'
        run: npm --prefix gui/web/workbench ci --no-fund --no-audit
      - name: Workbench (build and browser tests)
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 scripts/verify-web.py --skip-install --workbench --no-wait --tag ci-workbench
      # Only documents changed, and one of them is read by the timeline element's test (the `gui_doc_reads` list of
      # the job `changes`; the GUI server's tests run in gui-server): needs no browser and no C++ build.
      - name: Tests that read the changed documents (the timeline element)
        if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.gui_docs == 'true'
        run: npm --prefix gui/web run test:timeline
      # Only documents changed, and one of them has ```ts code blocks that gui/client/pack.mjs type-checks.
      - name: Client library package check of the changed READMEs
        if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.gui_pack_docs == 'true'
        run: npm --prefix gui/web run pack:client
      - name: End-to-end test timing summary
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        run: |
          if [ -f build/logs/ci-web-e2e.junit.xml ]; then
            python3 scripts/verify-web.py --summarize-junit build/logs/ci-web-e2e.junit.xml --top 20 || true
          fi
      - if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-gui-web
          path: build/logs/*.junit.xml
          retention-days: 14
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-gui
          path: |
            build/logs
            gui/web/test-results
          retention-days: 14

  # The GUI server's tests against the stand-in launcher (no Node, no C++ build). Apart from the job gui so that
  # the two run at the same time; also runs when a pull request changes only documents that these tests read.
  gui-server:
    needs: changes
    if: needs.changes.outputs.gui_server == 'true'
    name: gui (server)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VEHICLE_SIL_LOG_ARTIFACT: logs-gui-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Server
        run: python3 scripts/verify-gui.py --skip-web --no-wait --tag ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-gui-server
          path: build/logs
          retention-days: 14

  python:
    needs: changes
    name: python (3.11, .python-version, lowest dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VEHICLE_SIL_LOG_ARTIFACT: logs-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout of a pull request is its merge into the base: the first parent is the base.
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The repository squashes with the title of the commit when the pull request has one commit, and with the
      # title of the pull request otherwise (merge and rebase keep every commit's title). So the title of the
      # pull request is checked, and, for a single commit, that commit's message too. The commits of a longer
      # pull request are not checked one by one: a fix of an earlier one would need a force push. A re-run reads
      # the old title: after a fix, push a commit or close and reopen the pull request.
      - name: Title of the pull request, and files that must not be committed
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          fail=0
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          python3 scripts/check-commits.py --message "$RUNNER_TEMP/pr-title.txt" || fail=1
          if [ "$COMMITS" = 1 ]; then
            # The merge commit of the checkout: its second parent is the pull request's only commit.
            git log -1 --format=%B HEAD^2 > "$RUNNER_TEMP/commit-message.txt"
            python3 scripts/check-commits.py --message "$RUNNER_TEMP/commit-message.txt" || fail=1
          fi
          python3 scripts/check-commits.py --changed HEAD^1..HEAD || fail=1
          if [ "$fail" != 0 ]; then
            echo "::error::Fix the title or the commit message (or remove the file) as listed above. A re-run reads the old title: push a commit, or close and reopen the pull request"
            exit 1
          fi
      - name: Links in the documents
        run: python3 scripts/check-docs.py --require-english
      - name: Python checks
        env:
          DOCS_ONLY: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then
            py_ver=$(tr -d '[:space:]' < .python-version)
            test -n "$py_ver"
            python3 scripts/verify-python.py --python "$py_ver" --skip-lowest --only schema,template --tag ci
          else
            python3 scripts/verify-python.py --tag ci
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-python
          path: build/logs
          retention-days: 14

  # The one check that main's branch protection requires: it passes when every job above passed or was left
  # out (skipped), and fails on anything else. A new job goes into `needs` (tests/scripts/test_ci_workflow.py
  # checks it). Keep the name.
  # The one exception is linux-tsan (the thread sanitizer): it is not waited for, so that a pull request does not
  # wait for it; on main its failure fails the run, which release.yml reads. The address sanitizer's leg of `linux`
  # counts, and it runs on main only.
  # `if: always()` must stay: with `!cancelled()` a cancelled run would leave this job skipped, and a skipped
  # required check counts as passed.
  all-checks:
    name: all checks
    needs: [changes, linux, linux-oldest-cmake, windows, gui, gui-server, python]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was left out
        env:
          RESULTS: |
            changes ${{ needs.changes.result }}
            linux ${{ needs.linux.result }}
            linux-oldest-cmake ${{ needs.linux-oldest-cmake.result }}
            windows ${{ needs.windows.result }}
            gui ${{ needs.gui.result }}
            gui-server ${{ needs.gui-server.result }}
            python ${{ needs.python.result }}
        run: |
          echo "$RESULTS"
          if grep -v '^$' <<<"$RESULTS" | grep -qvE ' (success|skipped)$'; then
            echo "::error::A job did not succeed (listed above; only success and skipped pass): open it, fix it, or re-run it"
            exit 1
          fi
