# vehicle-sil-gui: the browser GUI's server (a member of the uv workspace of the repository root).
# It serves the built screen (gui/web), runs vehicle_sil_launch as a child process and relays its events.
# Develop and test it from the repository root: `uv sync`, then `uv run vehicle-sil-gui --help` and
# `uv run pytest gui/server/tests` (docs/gui.md).

[project]
name = "vehicle-sil-gui"
version = "0.1.0"
description = "Browser GUI of vehicle-sil: a local server that runs vehicle_sil_launch and shows its progress"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.14.5"]

[project.scripts]
vehicle-sil-gui = "vehicle_sil_gui.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
