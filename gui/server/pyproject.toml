# vehicle-sil-gui: the browser GUI's server (a member of the uv workspace of the repository root).
# It serves the built screen (gui/web), runs vehicle_sil_launch as a child process and relays its events.
# Develop and test it from the repository root: `uv sync`, then `uv run vehicle-sil-gui --help` and
# `uv run pytest gui/server/tests` (docs/gui.md).

[project]
name = "vehicle-sil-gui"
version = "0.1.0"
description = "Browser GUI of vehicle-sil: a local server that runs vehicle_sil_launch and shows its progress"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.14.5"]

[project.optional-dependencies]
# The ECUs' variables: the client side of the launcher's control server (gRPC). Without it the server runs, and
# says why it shows no variables. Not enough by itself outside the repository: the gRPC stubs are made from the
# repository's proto file with grpcio-tools (the `control` group; `uv sync` installs everything), or are given
# with VEHICLE_SIL_CONTROL_STUBS. They are not in the package yet.
variables = ["grpcio>=1.85.0", "protobuf>=7.35.1"]

[project.scripts]
vehicle-sil-gui = "vehicle_sil_gui.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
