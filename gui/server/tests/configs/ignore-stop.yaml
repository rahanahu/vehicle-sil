# A configuration of the GUI server's tests: replay_launcher.py plays what the real launcher wrote for it
# (recordings/, made by record_launcher.py: record again after changing this file).
# replay-fault: ignore-stop
vehicle_sil_simulation: 1
stop_timeout_ms: 600000  # the launcher waits for Logger until a second stop
# no stop_at_ms: runs until stopped
networks:
  - name: J1939_CAN
    kind: can
participants:
  - name: Engine
    command: [engine/vehicle_sil_engine_ecu]
  - name: Dashboard
    command: [dashboard/vehicle_sil_dashboard_ecu]
  - name: Logger
    command: [logger/stubborn_logger, "{registry_uri}"]  # ignores SIGTERM: the first stop waits for it
    describe: false
    required: false
