# A scenario of the GUI server's tests (the real launcher ran it with the example ECUs: recordings/).
vehicle_sil_scenario: 1
name: throttle up
steps:
  - at_ms: 0
    set: { Engine.engine.throttle: 50 }
  - wait_until: { Engine.engine.speed: { ge: 1700 } }
    timeout_ms: 500
  - expect: { Engine.engine.speed: { le: 4000 } }
