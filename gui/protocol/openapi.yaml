  /api/time:
    post:
      operationId: sendTimeCommand
      summary: Send a time command to the running simulation
      tags:
      - control
      description: 'Validates the command and writes one NDJSON line to the launcher''s standard input, returning HTTP 200
        as soon as the command is forwarded. HTTP 200 acknowledges forwarding only; whether the launcher accepted or refused
        the command arrives asynchronously on `/ws` as an `event` message with `event.event == "command"` (correlated by the
        optional numeric `id`; see `schemas/ws-command-event.schema.json`).


        Targeting: Protocol v4 preserves omitting both `run_id` and `instance` unchanged for compatibility (targeting whichever
        run is current). However, new clients, AI agents, and CI automation should always send both `instance` and `run_id`
        so the server refuses with `409 session-changed` if another run has started or the server restarted. Sending only
        one of `run_id` or `instance` returns `400 invalid-field`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeCommandRequest'
            examples:
              step:
                summary: Targeted step command (recommended for new clients, AI agents, and CI)
                value:
                  command: step
                  ms: 100
                  id: 1
                  instance: inst-1
                  run_id: inst-1-1
              pause:
                summary: Targeted pause command
                value:
                  command: pause
                  id: 2
                  instance: inst-1
                  run_id: inst-1-1
      responses:
        '200':
          description: Command forwarded to the launcher's standard input (asynchronous launcher decision follows as a WebSocket
            `command` event).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeCommandAck'
        '400':
          description: Malformed JSON (`invalid-json`) or invalid request/path/field (`invalid-field`, `invalid-path`, `outside-root`,
            `not-a-configuration`, `unknown-participant`, `unknown-network`, `target-not-listed`, `scenario-not-listed`, `unsupported`,
            `unknown-variable`, `not-writable`, `write-refused`).
