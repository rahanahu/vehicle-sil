      description: 'Validates variable names, writability, and value bounds against the active run''s schema, registers the
        write with the launcher Control Server in arrival order, and waits until every target ECU has left `sent` (`WAIT_FOR_QUEUED`,
        queued or immediately settled). HTTP 200 `{run_id, operation}` confirms ECU queue arrival (or immediate terminal settlement);
        the execution outcome arrives on `/ws` as `operation` messages. If the RPC fails or times out after `operation` is
        assigned, `502 write-failed` / `504 write-timeout` carries `detail: {operation, state: "sent"}`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteRequest'
      responses:
        '200':
          description: Write registered and acknowledged by every target ECU (`WAIT_FOR_QUEUED`, queued or immediately settled;
            final execution outcome arrives on `/ws` as `operation` messages).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
        '400':
          description: Malformed JSON (`invalid-json`) or invalid request/path/field (`invalid-field`, `invalid-path`, `outside-root`,
            `not-a-configuration`, `unknown-participant`, `unknown-network`, `target-not-listed`, `scenario-not-listed`, `unsupported`,
            `unknown-variable`, `not-writable`, `write-refused`).
          content:
