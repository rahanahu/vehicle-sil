                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with current server, run, or file state (`already-running`, `starting`, `not-running`, `launcher-unsupported`,
            `scenario-running`, `session-changed`, `config-changed`, `config-busy`, `variables-not-ready`).
