<!doctype html>
<!--
  The timeline page of vehicle-sil: open it in a browser and drop a timeline file on it (the JSON that
  "vehicle_sil_launch run <configuration> --scenario <scenario> --timeline <file>" writes). It is one
  <vehicle-sil-timeline> element (vehicle-sil-timeline.js) and what this page adds to it (page.js: ?src=, ?lang=,
  a file dropped or chosen, a file embedded below). The elements with data-text get their texts from messages.js
  (inside vehicle-sil-timeline.js) when the page starts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>vehicle-sil</title>
    <style>
      body {
        margin: 0;
        background: #f7f7f5;
        color: #1b1d20;
        font:
          14px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 1600px;
        margin: 0 auto;
        padding: 16px;
      }
      button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid #d7dadd;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #1f5fc4;
        outline-offset: 2px;
      }
      #load {
        border: 2px dashed #d7dadd;
        border-radius: 8px;
        padding: 40px 16px;
        text-align: center;
      }
      body.dragging #load,
      body.dragging vehicle-sil-timeline {
        outline: 2px solid #1f5fc4;
      }
      #page-error {
        border: 1px solid #c42525;
        border-left-width: 5px;
        border-radius: 6px;
        padding: 10px 14px;
      }
      .muted {
        opacity: 0.75;
      }
      .small {
        font-size: 0.85rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #131518;
          color: #e4e6e9;
        }
        button,
        #load {
          border-color: #343940;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <vehicle-sil-timeline>
        <button id="open" slot="actions" type="button" data-text="page.open"></button>
      </vehicle-sil-timeline>
      <input id="file" type="file" accept=".json,application/json" hidden />
      <p id="page-error" role="alert" hidden></p>
      <section id="load">
        <p data-text="page.drop"></p>
        <p class="muted small" data-text="page.what"></p>
        <noscript>
          <p lang="en">
            This page needs JavaScript (vehicle-sil-timeline.js and page.js next to it).
          </p>
          <p lang="ja">
            このページには JavaScript が要ります（隣に vehicle-sil-timeline.js と page.js）。
          </p>
        </noscript>
      </section>
    </main>
    <script type="application/json" id="timeline-data"></script>
    <script src="vehicle-sil-timeline.js"></script>
    <script src="page.js"></script>
  </body>
</html>
