<mat-toolbar class="toolbar">
  @if (navMode() === 'drawer') {
    <button
      #navToggle
      matIconButton
      type="button"
      data-testid="nav-toggle"
      aria-controls="app-nav"
      [attr.aria-expanded]="drawerOpen()"
      [attr.aria-label]="drawerOpen() ? closeLabel : openLabel"
      (click)="toggleDrawer()"
    >
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z" fill="currentColor" />
      </svg>
    </button>
  }
  <span class="title" data-testid="app-title" i18n>vehicle-sil</span>
  <!--
    言語のメニュー。いまの言語を読めない人も見つけられるよう、地球の絵と、言語の名前（その言語自身の文字）を出し、
    名前には英語の「Language」を添える。選ぶと読み込み直す（翻訳は起動の前に決まる）。
  -->
  <button
    #languageButton
    matButton
    type="button"
    class="language"
    data-testid="language-menu"
    [matMenuTriggerFor]="languageMenu"
    [attr.aria-label]="languageLabel"
  >
    <svg
      viewBox="0 0 24 24"
      width="20"
      height="20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" />
      <ellipse cx="12" cy="12" rx="4" ry="9" />
      <path d="M3 12h18M4.6 7.5h14.8M4.6 16.5h14.8" />
    </svg>
    <span [attr.lang]="currentLanguage.code">{{ currentLanguage.name }}</span>
  </button>
  <mat-menu #languageMenu="matMenu" xPosition="before">
    @for (language of languages; track language.code) {
      <button
        mat-menu-item
        type="button"
        role="menuitemradio"
        [attr.aria-checked]="language.code === currentLanguage.code"
        [attr.lang]="language.code"
        [attr.data-language]="language.code"
        (click)="chooseLanguage(language.code)"
      >
        <span class="check" aria-hidden="true">{{
          language.code === currentLanguage.code ? '✓' : ''
        }}</span>
        {{ language.name }}
      </button>
    }
  </mat-menu>
</mat-toolbar>

<!--
  開閉の状態は drawerOpen だけが持つ。Material の Esc と背景のクリックでの自動の閉じを止め（disableClose）、
  引き出しのときだけ閉じる（rail と full では Esc を押しても消えない）。閉じたらフォーカスを開くボタンへ戻す
  （Material は開く動きが終わったときに戻し先を覚えるので、開いている最中に閉じると body に落ちる）。
-->
<mat-sidenav-container class="body" (backdropClick)="closeDrawer()">
  <mat-sidenav
    id="app-nav"
    class="nav"
    data-testid="nav"
    [attr.data-nav-mode]="navMode()"
    [mode]="navMode() === 'drawer' ? 'over' : 'side'"
    [opened]="navOpened()"
    disableClose
    (keydown.escape)="closeDrawer()"
  >
    <nav aria-label="画面" i18n-aria-label>
      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            ariaCurrentWhenActive="page"
            #active="routerLinkActive"
            [activated]="active.isActive"
            [attr.aria-label]="item.label"
            [attr.title]="navMode() === 'rail' ? item.label : null"
            (click)="closeDrawer()"
          >
            <svg matListItemIcon viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path [attr.d]="item.icon" fill="currentColor" fill-rule="evenodd" />
            </svg>
            @if (navMode() !== 'rail') {
              <span matListItemTitle>{{ item.label }}</span>
            }
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content" data-testid="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
