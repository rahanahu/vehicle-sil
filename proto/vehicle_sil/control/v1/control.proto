// SPDX-License-Identifier: MIT
//
// The vehicle-sil Control API, version 1 (under development: messages may still change).
//
// Times are simulation times in nanoseconds since the start of the simulation (T = 0).
// The contract of the operations is described in docs/internals/control.md ("Control Agent" and
// "Control Server の中核").
syntax = "proto3";

package vehicle_sil.control.v1;

// ---- values and variables -------------------------------------------------------------------

message Value {
  oneof kind {
    bool b = 1;
    sint64 i = 2;
    double d = 3;
  }
}

enum ValueType {
  VALUE_TYPE_UNSPECIFIED = 0;
  VALUE_TYPE_BOOL = 1;
  VALUE_TYPE_INTEGER = 2;
  VALUE_TYPE_REAL = 3;
  VALUE_TYPE_ENUM = 4;
}

enum Causality {
  CAUSALITY_UNSPECIFIED = 0;
  CAUSALITY_INPUT = 1;
  CAUSALITY_OUTPUT = 2;
  CAUSALITY_PARAMETER = 3;
}

message EnumItem {
  string name = 1;
  sint64 value = 2;
}

message VariableInfo {
  string name = 1;
  ValueType type = 2;
  Causality causality = 3;
  string unit = 4;
  optional double min = 5;
  optional double max = 6;
  optional double step = 7;
  string description = 8;
  repeated EnumItem items = 9;
  // vehicle-sil gives it to the ECU, the ECU's application did not declare it: the server decides
  // by the name, which starts with "ecu." (every ECU's, such as "ecu.connected"), "peer." or
  // "j1939." (a Peer's monitoring outputs). An application variable whose name starts with
  // "j1939." is taken for one too.
  bool builtin = 10;
  // The name the participant's executable declared it under, if the simulation's configuration
  // maps it (the participant's "variables": another name, a linear conversion, names for its
  // values). Everything else here, the values read and the values written are as mapped. Empty:
  // not mapped.
  string source = 11;
}

message Snapshot {
  sint64 time_ns = 1;
  uint64 sequence = 2;
  repeated Value values = 3; // in schema order
}

enum EventLevel {
  EVENT_LEVEL_UNSPECIFIED = 0;
  EVENT_LEVEL_INFO = 1;
  EVENT_LEVEL_WARNING = 2;
  EVENT_LEVEL_ERROR = 3;
}

message Event {
  sint64 time_ns = 1;
  EventLevel level = 2;
  string text = 3;
}

// ---- writes ---------------------------------------------------------------------------------

enum LatePolicy {
  LATE_POLICY_UNSPECIFIED = 0; // as REJECT
  LATE_POLICY_REJECT = 1;
  LATE_POLICY_APPLY_NEXT = 2;
}

// ---- the client API -------------------------------------------------------------------------

message PingRequest {
  string text = 1;
}

message PingReply {
  string text = 1;
  string server_version = 2;
}

// What a peer's agent reported about its participant.
message PeerStatus {
  bool failed = 1;
  string error = 2;
}

message PeerInfo {
  string participant = 1;
  string incarnation = 2;
  bool connected = 3; // its agent is connected
  repeated VariableInfo schema = 4;
  PeerStatus status = 5;
  bool has_agent = 6;          // an agent has connected for it (else it is known from SIL Kit only)
  string simulation_state = 7; // its SIL Kit lifecycle state as the server sees it ("" if unknown)
  // Its agent runs on the simulation's time (its steps are those of the time synchronisation, as
  // its hello says); false: in real time, or no agent (has_agent false). GetSnapshotReply.consistent
  // looks only at the peers with virtual_time. An earlier server without this field leaves it
  // false for every peer.
  bool virtual_time = 8;
}

message ListPeersRequest {}

message ListPeersReply {
  repeated PeerInfo peers = 1;
  // Not empty: the server could not read the simulation's participants (why). The list then has
  // their last known states.
  string simulation_error = 2;
}

message GetValuesRequest {
  string peer = 1;
}

message GetValuesReply {
  bool has_values = 1;
  string incarnation = 2;
  Snapshot snapshot = 3;
}

message PeerWrite {
  string peer = 1;
  string name = 2;
  Value value = 3;
}

// Not resent by the client: a Write whose reply was lost may have been taken (sending it again
// makes a second operation). After pausing at now_ns, write with at_ns > now_ns.
message WriteRequest {
  repeated PeerWrite writes = 1; // at most the server's max_writes_per_request (4096 by default)
  optional sint64 at_ns = 2;
  LatePolicy late = 3;
}

enum TargetStatus {
  TARGET_STATUS_UNSPECIFIED = 0;
  TARGET_STATUS_SENT = 1;
  TARGET_STATUS_QUEUED = 2;
  TARGET_STATUS_DISCONNECTED = 3;
  TARGET_STATUS_APPLIED = 4;
  TARGET_STATUS_LATE = 5;
  TARGET_STATUS_REJECTED = 6; // a setter failed; values it wrote before stay
  TARGET_STATUS_CANCELLED = 7;
  TARGET_STATUS_INVALID = 8;
  TARGET_STATUS_BUSY = 9;
  TARGET_STATUS_UNKNOWN = 10;
}

message TargetResult {
  string peer = 1;
  TargetStatus status = 2;
  optional sint64 applied_at_ns = 3;
  bool late = 4;
  string reason = 5;
}

message Operation {
  uint64 seq = 1;
  WriteRequest request = 2;
  string client = 3;
  repeated TargetResult targets = 4;
  bool done = 5;
}

message WriteReply {
  uint64 seq = 1;
}

message GetOperationRequest {
  uint64 seq = 1;
}

enum WaitFor {
  WAIT_FOR_UNSPECIFIED = 0; // as DONE
  WAIT_FOR_DONE = 1;
  WAIT_FOR_QUEUED = 2;
}

message WaitOperationRequest {
  uint64 seq = 1;
  WaitFor until = 2;
  uint32 timeout_ms = 3;
}

message WatchRequest {
  repeated string peers = 1; // empty: all
  bool values = 2;
  bool events = 3;
  bool operations = 4;
  uint32 capacity = 5; // 0: the server's default; capped by the server's maximum
  bool time = 6;       // also the time state when it changes
  bool simulation = 7; // also the simulation state (participants, failure, end) when it changes
}

message Update {
  oneof kind {
    PeerInfo peer = 1;
    string removed_peer = 2;
    PeerValues values = 3;
    PeerEvent event = 4;
    Operation operation = 5;
    TimeState time = 7;
    bool initial_done = 8; // the current peers and values (and time and simulation) have been sent
    SimulationState simulation = 9;
  }
  // Updates dropped for this watch so far: changes of peers, values, events and operations, and
  // states of the simulation the server could not hold while the client was slow (failures and
  // the end are never lost: they stay in every later state).
  uint64 dropped = 6;
}

message PeerValues {
  string peer = 1;
  string incarnation = 2;
  Snapshot snapshot = 3;
}

message PeerEvent {
  string peer = 1;
  string incarnation = 2;
  Event event = 3;
}

// ---- time control (only when the server coordinates the simulation) -------------------------

message TimeState {
  bool available = 1; // false: the server does not control the time
  // While paused: every participant has run (or is running) its steps that start at or
  // before now_ns, and runs none after it.
  sint64 now_ns = 2;
  bool paused = 3;
  optional sint64 pause_target_ns = 4;
  optional double speed = 5;
  bool running = 6; // the simulation has started and not ended
  bool ended = 7;   // the simulation ran and is over (running is false before the start too)
}

// A participant of the coordinated simulation and its SIL Kit lifecycle state.
message ParticipantState {
  string participant = 1;
  string state = 2; // "" if the server has not seen one yet
}

// The coordinated simulation as the server's monitor sees it.
message SimulationState {
  bool available = 1; // false: the server does not coordinate a simulation
  repeated ParticipantState participants = 2; // the required participants
  // Not empty: the server could not read the simulation's state (why; both reasons when neither
  // the participants nor the time could be read); the rest is the last known.
  string error = 3;
  // A required participant that failed the simulation ("" if none), its state and why. Once set,
  // it stays: the server then ends the simulation.
  string failed_participant = 4;
  string failed_state = 5;
  string failure_reason = 6;
  bool ended = 7; // the simulation ran and is over
}

message GetTimeRequest {}

message GetSnapshotRequest {
  // Empty: every peer that has an agent. At most the server's max_peers_per_request (1024 by
  // default).
  repeated string peers = 1;
}

// The time state and the latest values of several peers, read in one go: the time first, then
// all the values at one moment.
message GetSnapshotReply {
  TimeState time = 1; // as GetTime (available = false: the server does not control the time)
  // With peers in the request: one entry per name, in the order given (a name given again is
  // left out). Without: one per peer that has an agent, by name. An entry without a snapshot:
  // the peer has no sample yet; without an incarnation too: it has no agent (or is unknown).
  repeated PeerValues values = 2;
  // For the peers that run on the simulation's time, when time.available, and as long as every
  // ECU publishes its samples from within its step (an ECU of ecu_main does; if that is broken,
  // the launcher reports the warning control-link-late-values and this does not hold). "Every
  // sample of a step" means the latest sample taken before that time: an agent samples every
  // sample period, which may be longer than its step. Whether a peer runs on the simulation's
  // time: PeerInfo.virtual_time (ListPeers, Watch). For one that does not, nothing is promised.
  // - Always: the values are not older than the time. Every sample of a step that started before
  //   time.now_ns is in them. They may be newer.
  // - consistent: the time stood still at time.now_ns (time.paused) and no entry of a peer on the
  //   simulation's time has a sample of a step after time.now_ns. The values are then those of that moment: every step before
  //   now_ns, none after it. A step that starts exactly at now_ns may or may not be in them yet
  //   (see Snapshot.time_ns; its sample arrives while the time stands still).
  // Not consistent: the simulation runs or has ended, it went on during the call and a sample of
  // a later step came in, or the server does not control the time. The values of a peer that
  // does not run on the simulation's time are not looked at (they carry another clock).
  bool consistent = 3;
}
message PauseRequest {
  optional sint64 at_ns = 1; // absent: at the step held for pacing, if any, else the next gate step
}
message ResumeRequest {}
message RunUntilRequest {
  sint64 at_ns = 1;
}
message StepRequest {
  sint64 duration_ns = 1;
}
message SetSpeedRequest {
  optional double speed = 1; // absent: as fast as possible
}
message WaitPausedRequest {
  uint32 timeout_ms = 1;
}
message StopRequest {
  string reason = 1;
}
message ForgetPeerRequest {
  string peer = 1;
}
message ForgetPeerReply {}

// Clients (GUI, CLI, Python) talk to the control server through this service.
//
// A server that only shows the simulation (vehicle_sil_launch while it plays a scenario) refuses
// the calls that change it (Write, ForgetPeer, Pause, Resume, RunUntil, Step, SetSpeed) with
// FAILED_PRECONDITION, whatever the caller's role, and says why in the trailing metadata
// "vehicle-sil-reason" ("scenario-running"). The other calls, Stop among them, are served.
service ControlService {
  rpc Ping(PingRequest) returns (PingReply);
  rpc ListPeers(ListPeersRequest) returns (ListPeersReply);
  rpc GetValues(GetValuesRequest) returns (GetValuesReply);
  rpc Write(WriteRequest) returns (WriteReply);
  rpc GetOperation(GetOperationRequest) returns (Operation);
  rpc WaitOperation(WaitOperationRequest) returns (Operation);
  rpc Watch(WatchRequest) returns (stream Update);
  // Removes a disconnected peer (operator): its open operations become UNKNOWN.
  rpc ForgetPeer(ForgetPeerRequest) returns (ForgetPeerReply);

  rpc GetTime(GetTimeRequest) returns (TimeState);
  // The time and the peers' latest values of one moment (see GetSnapshotReply.consistent).
  // RESOURCE_EXHAUSTED if the reply would be larger than a message may be: ask for fewer peers.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotReply);
  // Pause, Resume, RunUntil and Step: the last call wins (Resume and RunUntil drop a planned
  // pause; Pause with at_ns replaces an earlier target).
  rpc Pause(PauseRequest) returns (TimeState);
  rpc Resume(ResumeRequest) returns (TimeState);
  rpc RunUntil(RunUntilRequest) returns (TimeState);
  rpc Step(StepRequest) returns (TimeState);
  rpc SetSpeed(SetSpeedRequest) returns (TimeState);
  // FAILED_PRECONDITION once the simulation has ended (it will not stand still again).
  rpc WaitPaused(WaitPausedRequest) returns (TimeState);
  // Before the start: the simulation stops right after it starts.
  rpc Stop(StopRequest) returns (TimeState);
}
