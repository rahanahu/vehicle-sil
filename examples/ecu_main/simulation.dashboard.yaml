# yaml-language-server: $schema=../../gui/protocol/dashboard.schema.json
# The dashboard of simulation.yaml in the browser GUI (vehicle-sil-gui): which variables it shows, with
# which widget, in which order. The GUI reads this file from next to simulation.yaml; without it, the
# GUI lays out every variable by itself. The format: docs/gui.md ("ダッシュボードのファイル").
vehicle_sil_dashboard: 1
title: Engine and dashboard
panels: [panels/rpm-bar.js]
sections:
  - title: Engine
    items:
      - variable: Engine.engine.throttle
        widget: slider
        label: Throttle
        options: { step: 5 }
      - variable: Engine.engine.speed
        widget: graph
        label: Engine speed
      - panel: rpm-bar
        label: Engine speed (panel)
        variables: [Engine.engine.speed]
        options: { max: 4000 }
      # The rest of Engine's variables, and its monitoring variables folded after this section
      - auto: Engine
  - title: Dashboard
    items:
      - variable: Dashboard.dashboard.engine_speed
        label: Speed on the dashboard
      - auto: Dashboard
