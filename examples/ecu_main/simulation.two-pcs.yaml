# yaml-language-server: $schema=../../schema/simulation.schema.json
# The two ECUs of simulation.yaml over two computers (docs/howto/multi-pc.md): the registry listens on
# the network, and the Dashboard is started by hand, here or on another computer. CMake copies this
# file next to the executables (build/<preset>/examples/ecu_main/); there,
#   vehicle_sil_launch run simulation.two-pcs.yaml --stop-at-ms 1000
# prints the URI for other computers and waits for the Dashboard to join.
# SIL Kit does not authenticate: use this on a closed network only.
vehicle_sil_simulation: 2

registry_uri: silkit://0.0.0.0:8500
networks:
  - name: J1939_CAN
    kind: can
participants:
  - name: Engine
    command: [engine/vehicle_sil_engine_ecu]
    step_ms: 10
  - name: Dashboard
    command: [dashboard/vehicle_sil_dashboard_ecu]
    step_ms: 5
    manual: true
