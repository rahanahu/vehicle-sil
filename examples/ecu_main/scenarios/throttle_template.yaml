# yaml-language-server: $schema=../../../schema/scenario.schema.json
# Run the reusable throttle check template and then ramp the throttle back down:
#   vehicle_sil_launch run simulation.yaml --scenario scenarios/throttle_template.yaml
vehicle_sil_scenario: 1
name: throttle template
params:
  target_throttle: 50
  wait_timeout_ms: 500
steps:
  - name: mid-load check
    at_ms: 0
    template: templates/throttle_check.yaml
    params:
      throttle: "${target_throttle}"
      min_speed: 1700
      timeout_ms: "${wait_timeout_ms}"
      label: mid throttle
  - name: release throttle
    after_ms: 50
    ramp: { Engine.engine.throttle: { to: 0, over_ms: 200 } }
  - name: settle check
    expect: { Engine.engine.speed: { le: 1000 } }
    within_ms: 100
