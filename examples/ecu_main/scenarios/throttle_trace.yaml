# yaml-language-server: $schema=../../../schema/scenario.schema.json
# Move the throttle along a recorded trace (throttle_trace.csv beside this file: the time in ms
# since the step began, and the throttle in %), and see that the engine speed follows it.
# The exit code is 0 if every step passed:
#   vehicle_sil_launch run simulation.yaml --scenario scenarios/throttle_trace.yaml
vehicle_sil_scenario: 1
name: throttle trace
steps:
  - at_ms: 0
    set: { Engine.engine.throttle: 50 }
  - wait_until: { Engine.engine.speed: { ge: 1800 } }
    timeout_ms: 500
  # The points of the column "throttle" of the file, at the times of its first column: the
  # throttle goes on straight lines from point to point, to 70 % at 100 ms, and stays there.
  - wave: { Engine.engine.throttle: { points: { file: throttle_trace.csv, value: throttle } } }
  - expect: { Engine.engine.speed: { near: 2200, tolerance: 50 } }
