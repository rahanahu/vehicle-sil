# yaml-language-server: $schema=../../schema/simulation.schema.json
# Of the guide docs/howto/scenario-tests.md: examples/ecu_main/simulation.yaml with two variants, one
# with both ECUs and one without the dashboard. The guide copies simulation.yaml and appends the
# lines from "variants:" on; the scenarios of my_tests/ run with it:
#   vehicle_sil_launch test simulation.variants.yaml --scenarios my_tests/
vehicle_sil_simulation: 1
stop_at_ms: 1000
networks:
  - name: J1939_CAN
    kind: can
participants:
  - name: Engine
    command: [engine/vehicle_sil_engine_ecu]
    step_ms: 10
  - name: Dashboard
    command: [dashboard/vehicle_sil_dashboard_ecu]
    step_ms: 5
variants:
  full: {}
  engine_only:
    participants:
      Dashboard: { enabled: false }
