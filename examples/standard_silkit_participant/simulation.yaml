# yaml-language-server: $schema=../../schema/simulation.schema.json
# A vehicle-sil ECU (Engine, 10 ms step) and a standard Vector SIL Kit participant
# (StandardPeer, 25 ms step) sharing one CAN network under vehicle_sil_launch.
# Explicit time_step_ms (gcd(10, 25) = 5) aligns both step grids and avoids the 1 ms fallback
# used when a describe: false participant is present.
vehicle_sil_simulation: 2

time_step_ms: 5
networks:
  - name: J1939_CAN
    kind: can
participants:
  - name: Engine
    command: [../ecu_main/engine/vehicle_sil_engine_ecu]
    step_ms: 10
  - name: StandardPeer
    describe: false
    command:
      - ./standard_silkit_participant
      - --name
      - "{name}"
      - --registry-uri
      - "{registry_uri}"
      - --network
      - J1939_CAN
      - --step-ms
      - "25"
      - --tx-id
      - "0x200"
      - --tx-period-ms
      - "25"
