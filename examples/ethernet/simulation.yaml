# yaml-language-server: $schema=../../schema/simulation.schema.json
# The two ECUs of this directory, each a process of its own, on one Ethernet network. CMake copies
# this file next to the executables (build/<preset>/examples/ethernet/); check and run it there with
#   vehicle_sil_launch check simulation.yaml
#   vehicle_sil_launch run simulation.yaml --scenario scenarios/exchange.yaml
vehicle_sil_simulation: 1
stop_at_ms: 1000
networks:
  - name: ETH
    kind: ethernet
participants:
  - name: Sensor
    command: [sensor/vehicle_sil_eth_sensor_ecu]
    step_ms: 10
  - name: Display
    command: [display/vehicle_sil_eth_display_ecu]
    step_ms: 5
