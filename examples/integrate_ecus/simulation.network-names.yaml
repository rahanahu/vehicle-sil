# yaml-language-server: $schema=../../schema/simulation.schema.json
# simulation.yaml with the dashboard ECU as first handed over, its name for the bus mapped onto the
# agreed one: for an ECU that cannot be built again (the guide docs/howto/integrate-ecus.md).
vehicle_sil_simulation: 2

networks:
  - name: J1939_CAN
    kind: can
participants:
  - name: Engine
    command: [../ecu_main/engine/vehicle_sil_engine_ecu]
    step_ms: 10
  - name: Dashboard
    command: [dashboard_v1/vehicle_sil_dashboard_v1_ecu]
    step_ms: 5
    network_names: { J1939_CAN: VehicleCAN }
