<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Light and dark, as the browser is set (style.css says the same in color-scheme) -->
    <meta name="color-scheme" content="light dark" />
    <title>My vehicle-sil screen</title>
    <link rel="stylesheet" href="style.css" />
    <!-- The parts and the library: the GUI server serves them under /vsil/ (there is nothing to copy) -->
    <script type="module" src="/vsil/vehicle-sil-gui-elements.mjs"></script>
    <!-- Your own script. It lives in a file because the CSP blocks inline scripts -->
    <script type="module" src="main.js"></script>
    <!-- The element <vehicle-sil-timeline>, which the GUI server serves for every screen -->
    <script src="/timeline/vehicle-sil-timeline.js"></script>
  </head>
  <body>
    <h1>My vehicle-sil screen</h1>
    <vsil-status></vsil-status>

    <section>
      <h2>Run</h2>
      <vsil-run-controls></vsil-run-controls>
      <vsil-time-controls speeds="1 5 max"></vsil-time-controls>
    </section>

    <section>
      <h2>Variables</h2>
      <!-- To use your own ECU: change the variable attributes to "<participant>.<variable>" -->
      <p><label>Throttle <vsil-slider variable="Engine.engine.throttle"></vsil-slider></label></p>
      <p>Engine speed: <vsil-value variable="Engine.engine.speed"></vsil-value></p>
      <p>Engine lost: <vsil-value variable="Dashboard.dashboard.engine_lost" on="LOST" off="ok"></vsil-value></p>
      <p>
        <vsil-write variable="Engine.ecu.connected" value="false" label="Cut engine from the bus"></vsil-write>
        <vsil-write variable="Engine.ecu.connected" value="true" label="Connect engine to the bus"></vsil-write>
      </p>
    </section>

    <section>
      <h2>Your own script (main.js)</h2>
      <p>
        <label for="rpm">Engine speed</label>
        <meter id="rpm" min="0" max="6000" value="0"></meter>
        <output id="rpm-text">-</output>
        <small id="rpm-note"></small>
      </p>
      <p>
        <button type="button" id="floor">Throttle to 100 %</button>
        <span id="floor-error" role="alert"></span>
      </p>
    </section>

    <section>
      <h2>Scenario</h2>
      <p><label>Scenario of the next run <vsil-scenario-select></vsil-scenario-select></label></p>
      <vsil-scenario-result></vsil-scenario-result>
      <vehicle-sil-timeline lang="en" compact hide="help tables" hidden></vehicle-sil-timeline>
    </section>
  </body>
</html>
