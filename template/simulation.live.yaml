# The two ECUs of simulation.yaml, to watch and to touch: the simulation runs as fast as a clock
# (speed: 1) and has no stop_at_ms, so it runs until you stop it. Here:
#   vehicle_sil_launch run simulation.live.yaml    # Ctrl+C stops it (the exit code is then 130)
#   vehicle-sil-gui simulation.live.yaml           # the browser GUI: start and stop on the screen
# simulation.yaml is the one for scenarios and tests: as fast as possible, over at 1000 ms.
vehicle_sil_simulation: 1
speed: 1
networks:
  - name: J1939_CAN
    kind: can
participants:
  - name: Engine
    command: [bin/engine_ecu]
    step_ms: 10
  - name: Dashboard
    command: [bin/dashboard_ecu]
    step_ms: 5
