      - {name: w19, start_bit: 304, length: 16, signed: true, scale: 0.01}
      - {name: w20, start_bit: 320, length: 16, scale: 0.1}
      - {name: w21, start_bit: 336, length: 16, signed: true, scale: 0.01}
      - {name: w22, start_bit: 352, length: 16, scale: 0.1}
      - {name: w23, start_bit: 368, length: 16, signed: true, scale: 0.01}
      - {name: w24, start_bit: 384, length: 16, scale: 0.1}
