  - name: Bulk16
    comment: 32 two-byte signals, signed and unsigned, and a few exceptions.
    proprietary_b: 0x41
    length: 64
    signals:
      - {name: w00, start_bit: 0, length: 16, scale: 0.1}
      - {name: w01, start_bit: 16, length: 16, signed: true, scale: 0.01}
      - {name: w02, start_bit: 32, length: 16, scale: 0.1}
      - {name: w03, start_bit: 48, length: 16, signed: true, scale: 0.01}
      - {name: w04, start_bit: 64, length: 16, scale: 0.1}
      - {name: w05, start_bit: 80, length: 16, signed: true, scale: 0.01}
      - {name: w06, start_bit: 96, length: 16, scale: 0.1}
      - {name: w07, start_bit: 112, length: 16, signed: true, scale: 0.01}
      - {name: w08, start_bit: 128, length: 16, scale: 0.1}
      - {name: w09, start_bit: 144, length: 16, signed: true, scale: 0.01}
      - {name: w10, start_bit: 160, length: 16, scale: 0.1}
      - {name: w11, start_bit: 176, length: 16, signed: true, scale: 0.01}
