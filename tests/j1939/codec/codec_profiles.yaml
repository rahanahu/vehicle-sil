# Proprietary B messages of a made-up vendor, the way a large definition is written: one profile
# for the special values, chosen once for the whole file, and the exceptions where they are.
namespace: codec_profiles
indicators: vendor               # every signal below, unless its message or itself says otherwise
fill: 0x00                       # the vendor fills unused bits with 0
indicator_profiles:
  vendor:
    - when: {length: 8, signed: false}
      values: {sensor_error: 0xFE, not_available: 0xFF}
    - when: {length: 16, signed: false}
      values:
        sensor_error: {range: [0xFE00, 0xFEFF], send: 0xFEFF}   # sends the last value
        not_available: [0xFF00, 0xFFFF]
    - when: {length: 16, signed: true}
      values: {sensor_error: -32768, not_available: 0x7FFF}
  calibration:
    when: {length: 8, signed: false}
    values: {calibrating: 0x00, not_available: 0xFF}
messages:
  - name: Bulk8
    comment: 64 one-byte signals, all with the vendor's special values.
    proprietary_b: 0x40
    length: 64
    signals:
      - {name: s00, start_bit: 0, length: 8, scale: 0.5, unit: "%"}
      - {name: s01, start_bit: 8, length: 8, scale: 0.5, unit: "%"}
      - {name: s02, start_bit: 16, length: 8, scale: 0.5, unit: "%"}
      - {name: s03, start_bit: 24, length: 8, scale: 0.5, unit: "%"}
      - {name: s04, start_bit: 32, length: 8, scale: 0.5, unit: "%"}
      - {name: s05, start_bit: 40, length: 8, scale: 0.5, unit: "%"}
      - {name: s06, start_bit: 48, length: 8, scale: 0.5, unit: "%"}
