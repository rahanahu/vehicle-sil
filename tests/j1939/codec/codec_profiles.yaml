      - {name: w29, start_bit: 464, length: 16, signed: true, scale: 0.01}
      - {name: w30, start_bit: 480, length: 16, scale: 0.1, indicators: none}
      - {name: w31, start_bit: 496, length: 16, special_values: {saturated: 0xFFFF}}
  - name: Calibration
    comment: The whole message uses another profile; one signal goes back to the vendor's.
    proprietary_b: 0x42
    indicators: calibration
    fill: [0xFF, 0xFF, 0xFF, 0x00]
    length: 4
    signals:
      - {name: gain, start_bit: 0, length: 8}
      - {name: bias, start_bit: 8, length: 8, indicators: vendor}
      - {name: flags, start_bit: 16, length: 4}                 # no rule for 4 bits: no special values
      - {name: mode, start_bit: 20, length: 2, values: {low: 0, high: 2}}
  - name: Plain
    comment: No special values at all (a message that opts out of the file's profile).
    proprietary_b: 0x43
    indicators: none
    signals:
      - {name: counter, start_bit: 0, length: 8}
      - {name: offset, start_bit: 8, length: 16, signed: true}
      - {name: wide, start_bit: 24, length: 40}
  - name: Totals
    comment: A 64-bit signed signal whose lowest value is special.
    proprietary_b: 0x44
    indicators: none
    signals:
      - {name: total, start_bit: 0, length: 64, signed: true, special_values: {overflow: -9223372036854775808}}
